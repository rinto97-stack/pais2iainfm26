    function getTodayISO() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function addDaysISO(days) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function formatDateIndo(isoStr) {
      if (!isoStr) return '-';
      const parts = isoStr.split('-');
      if (parts.length !== 3) return isoStr;
      const bulan = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      const mIdx = Math.max(0, Math.min(11, parseInt(parts[1], 10) - 1));
      return `${parseInt(parts[2], 10)} ${bulan[mIdx]} ${parts[0]}`;
    }

    function getDaysRemaining(deadlineISO) {
      const today = new Date(getTodayISO() + 'T00:00:00');
      const target = new Date(deadlineISO + 'T00:00:00');
      return Math.round((target - today) / (1000 * 60 * 60 * 24));
    }

    function loadAppState() {
      const base = createInitialState();
      try {
        let raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          for (const k of LEGACY_KEYS) {
            const legacyRaw = localStorage.getItem(k);
            if (legacyRaw) {
              raw = legacyRaw;
              break;
            }
          }
        }
        if (!raw) return base;
        const parsed = JSON.parse(raw);
        return {
          ...base,
          ...parsed,
          activeSemester: [1, 2, 3, 4].includes(Number(parsed.activeSemester)) ? Number(parsed.activeSemester) : 1,
          session: { ...base.session, ...(parsed.session || {}) },
          secretaryConfig: { ...base.secretaryConfig, ...(parsed.secretaryConfig || {}) },
          studentPins: parsed.studentPins || {},
          semesterMataKuliah: parsed.semesterMataKuliah || {},
          attendance: parsed.attendance || base.attendance,
          studentSelfLogs: Array.isArray(parsed.studentSelfLogs) ? parsed.studentSelfLogs : [],
          studentMkTasks: { ...base.studentMkTasks, ...(parsed.studentMkTasks || {}) },
          assignments: Array.isArray(parsed.assignments) ? parsed.assignments : base.assignments,
          courseNotes: Array.isArray(parsed.courseNotes) ? parsed.courseNotes : base.courseNotes,
          savedGroups: parsed.savedGroups || {},
          spinnerHistory: Array.isArray(parsed.spinnerHistory) ? parsed.spinnerHistory : []
        };
      } catch (e) {
        return base;
      }
    }

      const prefix = smt === 1 ? mkId : `S${smt}_${mkId}`;
      return `${prefix}_P${pertemuan}`;
    }

    function isAttendanceKeyInSemester(key, smtId) {
      const smt = Number(smtId);
      if (smt === 1) {
        return !/^S[234]_/.test(key);
      }
      return key.startsWith(`S${smt}_`);
    }

    function getGroupStorageKey(smtId, mkId) {
      const smt = Number(smtId || getActiveSemesterId());
      return smt === 1 ? mkId : `S${smt}_${mkId}`;
    }

    function getMasterMahasiswa() {
      return (Array.isArray(appState.customMahasiswa) && appState.customMahasiswa.length > 0)
        ? appState.customMahasiswa
        : DEFAULT_MAHASISWA;
    }

    function getSemesterMataKuliahList(smtId) {
      const smt = Number(smtId || getActiveSemesterId());
      if (smt === 1) {
        return (Array.isArray(appState.customMataKuliah) && appState.customMataKuliah.length > 0)
          ? appState.customMataKuliah
          : DEFAULT_MATA_KULIAH;
      }
      if (Array.isArray(appState.semesterMataKuliah?.[smt]) && appState.semesterMataKuliah[smt].length > 0) {
        return appState.semesterMataKuliah[smt];
      }
      return DEFAULT_NEXT_SEMESTER_MK[smt] || [];
    }

    function getMasterMataKuliah(smtId) {
      return getSemesterMataKuliahList(smtId);
    }

    function getStudentByNim(nim) {
      return getMasterMahasiswa().find(m => m.nim === nim) || null;
    }

    function getMkById(mkId, smtId) {
      const targetSmt = Number(smtId || getActiveSemesterId());
      const primaryList = getMasterMataKuliah(targetSmt);
      const foundPrimary = primaryList.find(m => m.id === mkId);
      if (foundPrimary) return foundPrimary;

      for (const s of SEMESTERS_MASTER) {
        const list = getMasterMataKuliah(s.id);
        const found = list.find(m => m.id === mkId);
        if (found) return found;
      }
      return primaryList[0] || DEFAULT_MATA_KULIAH[0];
    }

    function getStudentPin(nim) {
      return appState.studentPins?.[nim] || nim.slice(-4);
    }

    function getSecretaryPhoneDisplay() {
      return appState.secretaryConfig?.phoneRaw || '082197900142';
    }

    function getSecretaryWaDigits() {
      let digits = String(getSecretaryPhoneDisplay()).replace(/\D/g, '');
      if (digits.startsWith('0')) digits = '62' + digits.slice(1);
      if (!digits.startsWith('62')) digits = '62' + digits;
      return digits;
    }

    function ensureSemesterSelectionConsistency(smtId) {
      const smt = Number(smtId || getActiveSemesterId());
      const mkList = getMasterMataKuliah(smt);
      const firstId = mkList[0]?.id || (smt === 1 ? 'MK01' : `S${smt}_MK01`);

      if (uiState.selectedMkId && !mkList.some(m => m.id === uiState.selectedMkId)) {
        uiState.selectedMkId = firstId;
      }
      if (uiState.studentPresensiMkId && !mkList.some(m => m.id === uiState.studentPresensiMkId)) {
        uiState.studentPresensiMkId = firstId;
      }
      if (uiState.tugasMkFilter && uiState.tugasMkFilter !== 'ALL' && !mkList.some(m => m.id === uiState.tugasMkFilter)) {
        uiState.tugasMkFilter = 'ALL';
      }
      if (uiState.secTugasMkId && !mkList.some(m => m.id === uiState.secTugasMkId)) {
        uiState.secTugasMkId = firstId;
      }
      if (uiState.kelompokMkId && !mkList.some(m => m.id === uiState.kelompokMkId)) {
        uiState.kelompokMkId = firstId;
      }
      if (uiState.spinnerMkId && !mkList.some(m => m.id === uiState.spinnerMkId)) {
        uiState.spinnerMkId = firstId;
      }
      if (uiState.rekapMkFilter && uiState.rekapMkFilter !== 'ALL' && uiState.rekapMkFilter !== 'ALL_4_SMT' && !mkList.some(m => m.id === uiState.rekapMkFilter)) {

      const smt = Number(smtId);
      if (![1, 2, 3, 4].includes(smt)) return;
      appState.activeSemester = smt;

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');

      const colors = {

        error: 'bg-rose-900 text-white border-rose-700',
        info: 'bg-slate-900 text-white border-slate-700'

      const el = document.createElement('div');
      el.className = `pointer-events-auto px-3.5 py-2.5 rounded-2xl border shadow-xl text-xs font-semibold flex items-center gap-2 animate-fade-up ${colors[type] || colors.info}`;
      el.innerHTML = `<span class="flex-1 leading-snug">${message}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';

    function copyTextToClipboard(text) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        return true;
      } catch (e) {
        return false;
      }
    }

    /**
     * =====================================================================
     * 5. STATISTIK KEHADIRAN & SINKRONISASI KODE WA [SYNC|...]
     * =====================================================================
     */
    function getStudentPersonalStats(nim, smtFilter = null) {
      const targetSmt = smtFilter === null ? getActiveSemesterId() : smtFilter;
      const keys = Object.keys(appState.attendance || {}).filter(k => {
        if (targetSmt === 'ALL') return true;
        return isAttendanceKeyInSemester(k, targetSmt);
      });

      let h = 0, i = 0, s = 0, a = 0, totalSessions = 0;
      keys.forEach(k => {
        const recs = appState.attendance[k]?.records || {};
        if (Object.keys(recs).length > 0) {
          totalSessions++;
          const st = recs[nim];
          if (st === 'H') h++;
          else if (st === 'I') i++;
          else if (st === 'S') s++;
          else if (st === 'A') a++;
        }
      });

      const pctHadir = totalSessions > 0 ? Math.round((h / totalSessions) * 100) : 0;
      return { h, i, s, a, totalSessions, pctHadir };
    }

    function getSemesterProgressSummary(smtId, nimFilter = null) {
      const smt = Number(smtId);
      const mkList = getMasterMataKuliah(smt);
      const targetSessions = mkList.length * PERTEMUAN_PER_SEMESTER;
      const recordedKeys = Object.keys(appState.attendance || {}).filter(k => isAttendanceKeyInSemester(k, smt));
      let completedSessions = 0;
      let studentHadir = 0;

      recordedKeys.forEach(k => {
        const recs = appState.attendance[k]?.records || {};
        if (Object.keys(recs).length > 0) {
          completedSessions++;
          if (nimFilter && recs[nimFilter] === 'H') {
            studentHadir++;
          }
        }
      });

      const pctProgress = targetSessions > 0 ? Math.min(100, Math.round((completedSessions / targetSessions) * 100)) : 0;
      const pctStudent = completedSessions > 0 ? Math.round((studentHadir / completedSessions) * 100) : 0;
      return {
        mkCount: mkList.length,
        targetSessions,
        completedSessions,
        studentHadir,
        pctProgress,
        pctStudent
      };
    }

    function formatSemesterSyncCode(smtId, nim, mkId, pertemuan, status) {
      const smt = Number(smtId || getActiveSemesterId());
      return `[SYNC|S${smt}|${nim}|${mkId}|${pertemuan}|${status}]`;
    }

    function parseSemesterSyncCode(rawText) {
      const matchNew = rawText.match(/\[SYNC\|S([1-4])\|(\d+)\|([A-Z0-9_]+)\|(\d+)\|([HISA])\]/i);
      if (matchNew) {
        return {
          smtId: Number(matchNew[1]),
          nim: matchNew[2],
          mkId: matchNew[3].toUpperCase(),
          pertemuan: Number(matchNew[4]),
          status: matchNew[5].toUpperCase()
        };
      }
      const matchLegacy = rawText.match(/\[SYNC\|(\d+)\|([A-Z0-9_]+)\|(\d+)\|([HISA])\]/i);
      if (matchLegacy) {
        return {
          smtId: 1,
          nim: matchLegacy[1],
          mkId: matchLegacy[2].toUpperCase(),
          pertemuan: Number(matchLegacy[3]),
          status: matchLegacy[4].toUpperCase()
        };
      }
      return null;
    }

    function syncNimInput(val) {
      const clean = val.trim();
      const found = getStudentByNim(clean);
      if (found) {
        uiState.loginNim = found.nim;
        const sel = document.getElementById('login-student-select');
        if (sel) sel.value = found.nim;
      }
    }

    function fillDefaultStudentPin() {
      const nimVal = (document.getElementById('login-student-nim')?.value || uiState.loginNim || '').trim();
      const mhs = getStudentByNim(nimVal);
      if (!mhs) {
        showToast('NIM tidak ditemukan dalam daftar mahasiswa.', 'error');
        return;
      }
      const pinInput = document.getElementById('login-student-pin');
      if (pinInput) pinInput.value = getStudentPin(mhs.nim);
    }

    function handleStudentLogin(e) {
      e.preventDefault();
      const nim = (document.getElementById('login-student-nim')?.value || '').trim();
      const pin = (document.getElementById('login-student-pin')?.value || '').trim();
      const mhs = getStudentByNim(nim);
      if (!mhs) {
        showToast('NIM tidak terdaftar pada kelas PAI Multikultur.', 'error');
        return;
      }
      const expectedPin = getStudentPin(mhs.nim);
      if (pin !== expectedPin) {
        showToast('PIN salah! Gunakan PIN Anda atau klik "Isi PIN Default".', 'error');
        return;
      }
      appState.session = { role: 'student', nim: mhs.nim };
      uiState.activeTab = 'beranda';
      saveState();
      renderApp();
      showToast(`Selamat datang, ${mhs.nama}!`, 'success');
    }

    function handleSecretaryLogin(e) {
      e.preventDefault();
      const pin = (document.getElementById('login-sec-pin')?.value || '').trim();
      const expected = appState.secretaryConfig?.pin || '0142';
      if (pin !== expected) {
        showToast('PIN Sekretaris Kelas tidak sesuai.', 'error');
        return;
      }
      appState.session = { role: 'secretary', nim: null };
      uiState.activeTab = 'beranda';
      saveState();
      renderApp();
      showToast('Berhasil masuk sebagai Sekretaris Kelas.', 'success');
    }

    function logoutSession() {
      appState.session = { role: null, nim: null };
      saveState();
      renderLoginPortal();
      showToast('Anda telah keluar dari portal.', 'info');

    function submitStudentSelfAttendance(e) {
      e.preventDefault();
      const mhs = getStudentByNim(appState.session.nim);
      if (!mhs) return;
      const activeSmt = getActiveSemesterId();
      const smtInfo = getSemesterInfo(activeSmt);
      const mk = getMkById(uiState.studentPresensiMkId, activeSmt);
      const pertemuan = uiState.studentPresensiPertemuan;
      const tanggal = document.getElementById('stu-att-date')?.value || getTodayISO();
      const status = document.querySelector('input[name="stu_status"]:checked')?.value || 'H';
      const note = (document.getElementById('stu-att-note')?.value || '').trim();

      const key = getAttendanceSessionKey(activeSmt, mk.id, pertemuan);
      if (!appState.attendance[key]) {
        appState.attendance[key] = { tanggal, topik: `Pertemuan ke-${pertemuan}`, records: {} };
      }
      appState.attendance[key].tanggal = tanggal;
      appState.attendance[key].records[mhs.nim] = status;

      appState.studentSelfLogs.unshift({
        id: 'LOG-' + Date.now(),
        smtId: activeSmt,
        nim: mhs.nim,
        mkId: mk.id,
        pertemuan,
        tanggal,
        status,
        metode: uiState.studentPresensiMetode,
        note
      });

      saveState();

      const statusLabel = { H: 'HADIR (H)', I: 'IZIN (I)', S: 'SAKIT (S)', A: 'ALPA (A)' }[status] || status;
      const syncCode = formatSemesterSyncCode(activeSmt, mhs.nim, mk.id, pertemuan, status);
      const stats = getStudentPersonalStats(mhs.nim, activeSmt);

      const waMsg = [
        `*LAPORAN PRESENSI KEHADIRAN MAHASISWA*`,
        `${INSTITUSI_INFO.program} - ${INSTITUSI_INFO.institusi}`,
        `------------------------------------`,
        `👤 *Nama:* ${mhs.nama}`,
        `🆔 *NIM:* ${mhs.nim}`,
        `🎓 *Periode:* ${smtInfo.fullLabel}`,
        `📚 *Mata Kuliah:* ${mk.nama}`,
        `🗓️ *Pertemuan:* Ke-${pertemuan} (${formatDateIndo(tanggal)})`,
        `📍 *Metode:* ${uiState.studentPresensiMetode}`,
        `✅ *Status:* *${statusLabel}*`,
        note ? `📝 *Ket:* ${note}` : null,
        `📊 *Rekap ${smtInfo.label}:* H:${stats.h} | I:${stats.i} | S:${stats.s} | A:${stats.a} (${stats.pctHadir}%)`,
        `------------------------------------`,
        syncCode
      ].filter(Boolean).join('\n');

      renderCurrentTab();
      launchWhatsAppMessage('Kirim Presensi ke Sekretaris Kelas', waMsg);
    }

              for (let p = 1; p <= PERTEMUAN_PER_SEMESTER; p++) {

    function sendStudentFullRecapToSecretaryWA() {
      const mhs = getStudentByNim(appState.session.nim);
      if (!mhs) return;
      const activeSmt = getActiveSemesterId();
      const smtInfo = getSemesterInfo(activeSmt);
      const mkList = getMasterMataKuliah(activeSmt);
      const stats = getStudentPersonalStats(mhs.nim, activeSmt);

      const mkLines = mkList.map(mk => {
        let h = 0, tot = 0;
        for (let p = 1; p <= PERTEMUAN_PER_SEMESTER; p++) {
          const k = getAttendanceSessionKey(activeSmt, mk.id, p);
          const st = appState.attendance[k]?.records?.[mhs.nim];
          if (st) {
            tot++;
            if (st === 'H') h++;
          }
        }
        return `• ${mk.idx}. ${mk.nama}: ${h}/${tot} Hadir`;
      });

      const waMsg = [
        `*REKAP KEHADIRAN PRIBADI MAHASISWA*`,
        `${INSTITUSI_INFO.program} - ${INSTITUSI_INFO.institusi}`,
        `👤 *Nama:* ${mhs.nama} (${mhs.nim})`,
        `🎓 *Periode:* ${smtInfo.fullLabel}`,
        `------------------------------------`,
        ...mkLines,
        `------------------------------------`,
        `📊 *Total:* Hadir ${stats.h} | Izin ${stats.i} | Sakit ${stats.s} | Alpa ${stats.a} (${stats.pctHadir}%)`
      ].join('\n');

      launchWhatsAppMessage('Kirim Rekap Kehadiran ke Sekretaris', waMsg);
    }

    function updateStudentPin(e) {
      e.preventDefault();
      const mhs = getStudentByNim(appState.session.nim);
      const val = (document.getElementById('new-student-pin')?.value || '').trim();
      const secPhone = (document.getElementById('student-sec-phone')?.value || '').trim();
      if (!/^\d{4}$/.test(val)) {
        showToast('PIN harus berupa 4 digit angka.', 'error');
        return;
      }
      if (secPhone.replace(/\D/g, '').length < 9) {
        showToast('Nomor WhatsApp Sekretaris minimal 9 digit angka.', 'error');
        return;
      }
      appState.studentPins[mhs.nim] = val;
      appState.secretaryConfig.phoneRaw = secPhone;
      saveState();
      closeModal();
      renderCurrentTab();
      showToast('PIN pribadi & Nomor WA Sekretaris berhasil diperbarui!', 'success');
    }

      appState.studentMkTasks[mhs.nim][mkId] = {
        mandiriJudul: (document.getElementById(`stu-mandiri-judul-${mkId}`)?.value || '').trim(),
        mandiriStatus: document.getElementById(`stu-mandiri-st-${mkId}`)?.value || 'Belum',

        presentasiStatus: document.getElementById(`stu-pres-st-${mkId}`)?.value || 'Belum',

      };
      saveState();
      renderCurrentTab();

    function sendStudentMkTaskToSecretaryWA(mkId) {
      const mhs = getStudentByNim(appState.session.nim);
      if (!mhs) return;
      if (!appState.studentMkTasks[mhs.nim]) appState.studentMkTasks[mhs.nim] = {};

      const mandiriJudul = (document.getElementById(`stu-mandiri-judul-${mkId}`)?.value || appState.studentMkTasks[mhs.nim][mkId]?.mandiriJudul || '').trim();
      const mandiriStatus = document.getElementById(`stu-mandiri-st-${mkId}`)?.value || appState.studentMkTasks[mhs.nim][mkId]?.mandiriStatus || 'Belum';
      const presentasiJudul = (document.getElementById(`stu-pres-judul-${mkId}`)?.value || appState.studentMkTasks[mhs.nim][mkId]?.presentasiJudul || '').trim();
      const presentasiStatus = document.getElementById(`stu-pres-st-${mkId}`)?.value || appState.studentMkTasks[mhs.nim][mkId]?.presentasiStatus || 'Belum';

    function shareSessionRecapWA() {
      const activeSmt = getActiveSemesterId();
      const smtInfo = getSemesterInfo(activeSmt);
      const mk = getMkById(uiState.selectedMkId, activeSmt);
      const key = getAttendanceSessionKey(activeSmt, uiState.selectedMkId, uiState.selectedPertemuan);
      const sess = appState.attendance[key] || { tanggal: getTodayISO(), topik: '', records: {} };
      const mhsList = getMasterMahasiswa();

      let h = 0, i = 0, s = 0, a = 0;
      const lines = mhsList.map(m => {
        const st = sess.records?.[m.nim] || '-';
        if (st === 'H') h++;
        else if (st === 'I') i++;
        else if (st === 'S') s++;
        else if (st === 'A') a++;
        return `${m.no}. ${m.nama} (${m.nim}) : *${st}*`;
      });

      const teks = [
        `*REKAP PRESENSI PERKULIAHAN*`,
        `${INSTITUSI_INFO.program} - ${INSTITUSI_INFO.institusi}`,
        `🎓 *Periode:* ${smtInfo.fullLabel}`,
        `📚 *Mata Kuliah:* ${mk.nama}`,
        `🗓️ *Pertemuan:* Ke-${uiState.selectedPertemuan} (${formatDateIndo(sess.tanggal)})`,
        sess.topik ? `📝 *Materi:* ${sess.topik}` : null,
        `------------------------------------`,
        ...lines,
        `------------------------------------`,
        `📊 *Ringkasan:* Hadir: ${h} | Izin: ${i} | Sakit: ${s} | Alpa: ${a}`
      ].filter(Boolean).join('\n');

      launchWhatsAppMessage('Kirim Rekap Presensi Pertemuan', teks);
    }

      e.preventDefault();

      appState.studentMkTasks[nim][mkId] = {
        mandiriJudul: (document.getElementById('sec-mk-mandiri')?.value || '').trim(),
        mandiriStatus: document.getElementById('sec-mk-mandiri-st')?.value || 'Belum',
        presentasiJudul: (document.getElementById('sec-mk-pres')?.value || '').trim(),
        presentasiStatus: document.getElementById('sec-mk-pres-st')?.value || 'Belum',
        catatan: appState.studentMkTasks[nim][mkId]?.catatan || ''
      };

      closeModal();
      renderCurrentTab();
      showToast('Data judul tugas mahasiswa diperbarui.', 'success');

    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function generateSmartGroups() {
      const mhsList = getMasterMahasiswa();
      const k = Math.max(2, Math.min(mhsList.length, uiState.jumlahKelompok));
      const groups = Array.from({ length: k }, (_, idx) => ({ nama: `Kelompok ${idx + 1}`, members: [] }));

      if (uiState.metodeKelompok === 'gender') {
        const laki = shuffleArray(mhsList.filter(m => m.jk === 'L'));
        const perempuan = shuffleArray(mhsList.filter(m => m.jk === 'P'));
        const combined = [...laki, ...perempuan];
        combined.forEach((m, idx) => {
          groups[idx % k].members.push(m);
        });
      } else {
        shuffleArray(mhsList).forEach((m, idx) => {
          groups[idx % k].members.push(m);
        });
      }

      uiState.previewGroups = groups;
      renderCurrentTab();
    }

    function saveGeneratedGroups() {
      if (!uiState.previewGroups) return;
      const activeSmt = getActiveSemesterId();
      const groupKey = getGroupStorageKey(activeSmt, uiState.kelompokMkId);
      appState.savedGroups[groupKey] = uiState.previewGroups;
      uiState.previewGroups = null;
      saveState();
      renderCurrentTab();
      showToast(`Kelompok ${getSemesterInfo(activeSmt).label} berhasil disimpan!`, 'success');
    }

    function copySavedGroupWA() {
      const activeSmt = getActiveSemesterId();
      const smtInfo = getSemesterInfo(activeSmt);
      const groupKey = getGroupStorageKey(activeSmt, uiState.kelompokMkId);
      const groups = appState.savedGroups[groupKey];
      if (!groups) return;
      const mk = getMkById(uiState.kelompokMkId, activeSmt);
      const blocks = groups.map(g => {
        const list = g.members.map((m, idx) => `   ${idx + 1}. ${m.nama} (${m.jk})`).join('\n');
        return `*${g.nama}*\n${list}`;
      });
      const teks = [
        `*PEMBAGIAN KELOMPOK DISKUSI / MAKALAH*`,
        `${INSTITUSI_INFO.program} - ${INSTITUSI_INFO.institusi}`,
        `🎓 *Periode:* ${smtInfo.fullLabel}`,
        `📚 *Mata Kuliah:* ${mk.nama}`,
        `------------------------------------`,
        ...blocks
      ].join('\n\n');
      launchWhatsAppMessage('Kirim Pembagian Kelompok', teks);
    }

    function spinRandomizer() {
      if (uiState.isSpinning) return;
      const activeSmt = getActiveSemesterId();
      let candidates = [];
      if (uiState.spinnerMode === 'individu') {
        candidates = getMasterMahasiswa().map(m => ({ id: m.nim, label: m.nama, sub: `NIM ${m.nim} (${m.jk})` }));
      } else {
        const groupKey = getGroupStorageKey(activeSmt, uiState.spinnerMkId);
        const saved = appState.savedGroups[groupKey];
        if (!saved || saved.length === 0) {
          showToast('Simpan pembagian kelompok pada MK ini terlebih dahulu.', 'error');
          return;
        }
        candidates = saved.map(g => ({ id: g.nama, label: g.nama, sub: g.members.map(m => m.nama.split(' ')[0]).join(', ') }));
      }

      uiState.isSpinning = true;
      let ticks = 0;
      const interval = setInterval(() => {
        const pick = candidates[Math.floor(Math.random() * candidates.length)];
        const mainText = document.getElementById('spinner-main-text');
        const subText = document.getElementById('spinner-sub-text');
        if (mainText) mainText.textContent = pick.label;
        if (subText) subText.textContent = pick.sub;
        ticks++;
        if (ticks >= 16) {
          clearInterval(interval);
          uiState.isSpinning = false;
          uiState.spinnerWinner = pick;
          renderCurrentTab();
        }
      }, 75);
    }

    /**
     * =====================================================================
     * 13. PENGINGAT TAGIHAN TUGAS & GENERATOR PESAN WA
     * =====================================================================
     */
    function renderSecretaryPengingatTab() {
      const mhsList = getMasterMahasiswa();
      const sorted = [...appState.assignments].sort((a, b) => a.deadline.localeCompare(b.deadline));

      return `
        <div class="space-y-4 animate-fade-up">
          <div class="flex items-center justify-between gap-2">
            <div>
              <h2 class="font-display font-bold text-base text-slate-900">Pengingat Tagihan Tugas</h2>
              <p class="text-[11px] text-slate-500">Pantau tenggat waktu & kirim pengingat grup WA</p>
            </div>
            <button type="button" onclick="uiState.showAddReminderForm=!uiState.showAddReminderForm; renderCurrentTab();" class="px-3 py-2 rounded-xl bg-emerald-800 text-white text-[11px] font-bold">
              ${uiState.showAddReminderForm ? 'Tutup' : '+ Tagihan'}
            </button>
          </div>

          ${uiState.showAddReminderForm ? `
            <form onsubmit="submitNewReminder(event)" class="bg-white rounded-2xl border border-emerald-200 p-4 shadow-xs space-y-3">
              <div>
                <label class="block text-[11px] font-bold text-slate-600 mb-1">Mata Kuliah</label>
                <select id="rem-mk" class="w-full p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs font-bold">
                  ${getMasterMataKuliah(getActiveSemesterId()).map(mk => `<option value="${mk.id}">${mk.idx}. ${mk.nama}</option>`).join('')}
                </select>
              </div>
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-[11px] font-bold text-slate-600 mb-1">Jenis Tagihan</label>
                  <select id="rem-kat" class="w-full p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs font-bold">
                    <option value="Tugas Mandiri">Tugas Mandiri</option>
                    <option value="Presentasi">Presentasi</option>
                  </select>
                </div>
                <div>
                  <label class="block text-[11px] font-bold text-slate-600 mb-1">Batas Akhir</label>
                  <input id="rem-deadline" type="date" value="${addDaysISO(3)}" class="w-full p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs font-bold" required />
                </div>
              </div>
              <div>
                <label class="block text-[11px] font-bold text-slate-600 mb-1">Deskripsi Tagihan</label>
                <input id="rem-judul" type="text" placeholder="Contoh: Pengumpulan Makalah Bab I-III" class="w-full p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs" required />
              </div>
              <button type="submit" class="w-full py-2.5 rounded-xl bg-emerald-800 text-white text-xs font-bold">Simpan Tagihan</button>
            </form>
          ` : ''}

          <div class="space-y-3">
            ${sorted.map(tgs => {
              const mk = getMkById(tgs.mkId, tgs.smtId || 1);
              const missing = mhsList.filter(m => !tgs.submissions?.[m.nim]?.done);
              const days = getDaysRemaining(tgs.deadline);
              const badge = days < 0 ? `Terlewat ${Math.abs(days)}h` : days === 0 ? 'Hari Ini!' : `H-${days}`;
              const badgeCls = days <= 2 ? 'bg-rose-100 text-rose-800' : 'bg-amber-100 text-amber-800';

              return `
                <div class="bg-white rounded-2xl border border-slate-200/90 p-3.5 shadow-xs space-y-2.5">
                  <div class="flex items-start justify-between gap-2">
                    <div>
                      <span class="text-[10px] font-extrabold text-emerald-700">${tgs.kategori} • ${mk?.nama || ''}</span>
                      <h3 class="font-display font-bold text-xs text-slate-900 mt-0.5">${tgs.judul}</h3>
                    </div>
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold shrink-0 ${badgeCls}">${badge}</span>
                  </div>
                  <p class="text-[11px] text-slate-600">
                    Tenggat: <strong>${formatDateIndo(tgs.deadline)}</strong> • Belum kumpul: <strong class="text-rose-700">${missing.length} Mahasiswa</strong>
                  </p>
                  ${missing.length > 0 ? `
                    <div class="p-2.5 rounded-xl bg-rose-50/70 border border-rose-200/70 text-[10.5px] text-rose-900">
                      ${missing.map(m => `${m.no}. ${m.nama}`).join(', ')}
                    </div>
                  ` : `
                    <div class="p-2 rounded-xl bg-emerald-50 text-emerald-800 text-[11px] font-bold">
                      ✅ Seluruh 14 mahasiswa telah mengumpulkan!
                    </div>
                  `}
                  <button type="button" onclick="generateAndCopyReminderWA('${tgs.id}')" class="w-full py-2 rounded-xl bg-emerald-800 text-white text-xs font-bold">
                    Buat & Kirim Pengingat WA
                  </button>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function submitNewReminder(e) {
      e.preventDefault();
      const mkId = document.getElementById('rem-mk')?.value || 'MK01';
      const kategori = document.getElementById('rem-kat')?.value || 'Tugas Mandiri';
      const deadline = document.getElementById('rem-deadline')?.value || addDaysISO(3);
      const judul = (document.getElementById('rem-judul')?.value || '').trim();
      if (!judul) return;

      const subs = {};
      getMasterMahasiswa().forEach(m => { subs[m.nim] = { done: false, score: '' }; });

      appState.assignments.unshift({
        id: 'TGS-' + Date.now(),
        smtId: getActiveSemesterId(),
        mkId,
        kategori,
        judul,
        deadline,
        submissions: subs
      });
      uiState.showAddReminderForm = false;
      saveState();
      renderCurrentTab();
      showToast('Pengingat tagihan baru ditambahkan!', 'success');
    }

    function generateAndCopyReminderWA(tugasId) {
      const tgs = appState.assignments.find(a => a.id === tugasId);
      if (!tgs) return;
      const mk = getMkById(tgs.mkId, tgs.smtId || 1);
      const missing = getMasterMahasiswa().filter(m => !tgs.submissions?.[m.nim]?.done);

      const teks = [
        `*PENGINGAT TAGIHAN TUGAS PERKULIAHAN*`,
        `${INSTITUSI_INFO.program} - ${INSTITUSI_INFO.institusi}`,
        `------------------------------------`,
        `Assalamu'alaikum Wr. Wb. Rekan-rekan Mahasiswa,`,
        `Mengingatkan kembali batas pengumpulan tagihan berikut:`,
        `📚 *Mata Kuliah:* ${mk?.nama || '-'}`,
        `📌 *Tagihan:* ${tgs.judul} (${tgs.kategori})`,
        `⏰ *Tenggat:* ${formatDateIndo(tgs.deadline)}`,
        missing.length > 0
          ? `\n*Daftar yang belum tercatat mengumpulkan (${missing.length} Mhs):*\n` + missing.map(m => `${m.no}. ${m.nama} (${m.nim})`).join('\n')
          : `\nAlhamdulillah seluruh 14 mahasiswa sudah tercatat mengumpulkan.`,
        `\nTerima kasih atas perhatiannya. Wassalamu'alaikum Wr. Wb.`
      ].join('\n');

      launchWhatsAppMessage('Pesan Pengingat Tagihan WA', teks);
    }

    /**
     * =====================================================================
     * 14. MODAL UTILITAS SEKRETARIS: IMPOR WA, PENGATURAN, EDIT MK & MASTER
     * =====================================================================
     */
    function openWaSyncImporterModal() {
      openModal(`
        <div class="p-5 overflow-y-auto space-y-3">
          <div class="flex items-start justify-between gap-2 pb-2.5 border-b border-slate-100">
            <div>
              <span class="text-[10px] font-extrabold uppercase tracking-wider text-emerald-700">Sinkronisasi Lintas 4 Semester</span>
              <h3 class="font-display font-bold text-sm text-slate-900 mt-0.5">Impor Laporan WA Mahasiswa</h3>
            </div>
            <button onclick="closeModal()" class="p-1.5 rounded-xl bg-slate-100 text-slate-500">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
          <p class="text-[11px] text-slate-600 leading-relaxed">
            Tempel pesan WhatsApp yang dikirim mahasiswa (mengandung kode <code class="px-1 py-0.5 rounded bg-slate-100 font-mono text-emerald-800">[SYNC|S1|NIM|MK01|1|H]</code>). Anda dapat menempel banyak laporan sekaligus.
          </p>
          <textarea id="wa-sync-input" rows="6" placeholder="Tempel pesan WA dari mahasiswa di sini..." class="w-full p-3 rounded-xl bg-slate-50 border border-slate-200 text-xs font-mono"></textarea>
          <button type="button" onclick="processWaSyncImport()" class="w-full py-2.5 rounded-xl bg-emerald-800 text-white text-xs font-extrabold">
            Proses & Perbarui Rekap Otomatis
          </button>
        </div>
      `);
    }

    function processWaSyncImport() {
      const raw = (document.getElementById('wa-sync-input')?.value || '').trim();
      if (!raw) {
        showToast('Tempel pesan WA terlebih dahulu.', 'error');
        return;
      }
      const lines = raw.split(/\n+/);
      let imported = 0;

      lines.forEach(line => {
        const parsed = parseSemesterSyncCode(line);
        if (parsed && getStudentByNim(parsed.nim)) {
          const key = getAttendanceSessionKey(parsed.smtId, parsed.mkId, parsed.pertemuan);
          if (!appState.attendance[key]) {
            appState.attendance[key] = { tanggal: getTodayISO(), topik: `Pertemuan ke-${parsed.pertemuan}`, records: {} };
          }
          appState.attendance[key].records[parsed.nim] = parsed.status;
          imported++;
        }
      });

      if (imported === 0) {
        const single = parseSemesterSyncCode(raw);
        if (single && getStudentByNim(single.nim)) {
          const key = getAttendanceSessionKey(single.smtId, single.mkId, single.pertemuan);
          if (!appState.attendance[key]) {
            appState.attendance[key] = { tanggal: getTodayISO(), topik: `Pertemuan ke-${single.pertemuan}`, records: {} };
          }
          appState.attendance[key].records[single.nim] = single.status;
          imported = 1;
        }
      }

      if (imported === 0) {
        showToast('Kode [SYNC|...] tidak ditemukan atau NIM tidak valid.', 'error');
        return;
      }

      saveState();
      closeModal();
      renderCurrentTab();
      showToast(`${imported} laporan kehadiran mahasiswa berhasil disinkronkan!`, 'success');
    }

    function openSemesterMkEditorModal(targetSmt) {
      const smt = Number(targetSmt || getActiveSemesterId());
      const smtInfo = getSemesterInfo(smt);
      const currentList = getSemesterMataKuliahList(smt);
      const textLines = currentList.map(m => m.nama).join('\n');

      openModal(`
        <div class="p-5 overflow-y-auto">
          <div class="flex items-start justify-between gap-2 pb-3 border-b border-slate-100">
            <div>
              <span class="text-[10px] font-extrabold uppercase tracking-wider text-emerald-700">Kurikulum 2 TP (4 Semester)</span>
              <h3 class="font-display font-bold text-sm text-slate-900 mt-0.5">Kelola Mata Kuliah — ${smtInfo.fullLabel}</h3>
            </div>
            <button onclick="closeModal()" class="p-1.5 rounded-xl bg-slate-100 text-slate-500">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>

          <div class="mt-3 grid grid-cols-4 gap-1">
            ${SEMESTERS_MASTER.map(s => `
              <button type="button" onclick="openSemesterMkEditorModal(${s.id})" class="py-1.5 px-1 rounded-xl text-center text-[10px] font-bold border ${s.id === smt ? 'bg-emerald-800 text-white border-emerald-800' : 'bg-slate-50 text-slate-600 border-slate-200'}">
                ${s.label}<br><span class="text-[8px] font-normal">${s.tp}</span>
              </button>
            `).join('')}
          </div>

          <form onsubmit="saveSemesterMkList(event, ${smt})" class="mt-3 space-y-3">
            <div>
              <label class="block text-[11px] font-bold text-slate-700 mb-1">
                Daftar Mata Kuliah ${smtInfo.label} (1 baris = 1 MK, masing-masing 16 Pertemuan)
              </label>
              <textarea id="smt-mk-textarea" rows="7" class="w-full p-3 rounded-xl bg-slate-50 border border-slate-200 text-xs font-semibold text-slate-800 leading-relaxed" required>${textLines}</textarea>
            </div>
            <div class="flex gap-2">
              <button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold">Batal</button>
              <button type="submit" class="flex-1 py-2.5 rounded-xl bg-emerald-800 text-white text-xs font-bold shadow-xs">Simpan MK ${smtInfo.label}</button>
            </div>
          </form>
        </div>
      `);
    }

    function saveSemesterMkList(event, smtId) {
      event.preventDefault();
      const smt = Number(smtId);
      const raw = document.getElementById('smt-mk-textarea')?.value || '';
      const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
      if (lines.length === 0) {
        showToast('Minimal harus ada 1 mata kuliah.', 'error');
        return;
      }
      const prefix = smt === 1 ? 'MK' : `S${smt}_MK`;
      const mapped = lines.map((nama, i) => ({
        id: `${prefix}${String(i + 1).padStart(2, '0')}`,
        idx: i + 1,
        kode: `PAI-${500 + smt * 100 + (i + 1)}`,
        nama: nama.toUpperCase()
      }));

      if (smt === 1) {
        appState.customMataKuliah = mapped;
      } else {
        if (!appState.semesterMataKuliah) appState.semesterMataKuliah = {};
        appState.semesterMataKuliah[smt] = mapped;
      }
      ensureSemesterSelectionConsistency(smt);
      saveState();
      closeModal();
      renderCurrentTab();
      showToast(`Daftar MK ${getSemesterInfo(smt).fullLabel} (${mapped.length} MK × 16 Pertemuan) disimpan!`, 'success');
    }

    function openMasterDataManagerModal() {
      const mhsLines = getMasterMahasiswa().map(m => `${m.nim} | ${m.jk} | ${m.nama}`).join('\n');
      openModal(`
        <div class="p-5 overflow-y-auto space-y-3">
          <div class="flex items-start justify-between gap-2 pb-2.5 border-b border-slate-100">
            <div>
              <span class="text-[10px] font-extrabold uppercase tracking-wider text-emerald-700">Data Master Kelas</span>
              <h3 class="font-display font-bold text-sm text-slate-900 mt-0.5">Daftar Mahasiswa (14 Mahasiswa)</h3>
            </div>
            <button onclick="closeModal()" class="p-1.5 rounded-xl bg-slate-100 text-slate-500">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
          <p class="text-[10.5px] text-slate-500">Format per baris: <code class="font-mono">NIM | L/P | NAMA LENGKAP</code></p>
          <textarea id="master-mhs-lines" rows="9" class="w-full p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-[11px] font-mono">${mhsLines}</textarea>
          <div class="flex gap-2">
            <button type="button" onclick="resetDefaultMasterStudents()" class="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold">Pulihkan 14 Default</button>
            <button type="button" onclick="saveMasterStudentsList()" class="flex-1 py-2.5 rounded-xl bg-emerald-800 text-white text-xs font-bold">Simpan Daftar</button>
          </div>
        </div>
      `);
    }

    function saveMasterStudentsList() {
      const raw = (document.getElementById('master-mhs-lines')?.value || '').trim();
      const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
      const parsed = [];
      lines.forEach((line, idx) => {
        const parts = line.split('|').map(p => p.trim());
        if (parts.length >= 3) {
          parsed.push({
            no: idx + 1,
            nim: parts[0],
            jk: parts[1].toUpperCase() === 'L' ? 'L' : 'P',
            nama: parts.slice(2).join(' ').toUpperCase()
          });
        }
      });
      if (parsed.length === 0) {
        showToast('Format baris tidak valid. Gunakan NIM | L/P | NAMA', 'error');
        return;
      }
      appState.customMahasiswa = parsed;
      saveState();
      closeModal();
      renderCurrentTab();
      showToast(`Daftar ${parsed.length} mahasiswa berhasil diperbarui!`, 'success');
    }

    function resetDefaultMasterStudents() {
      appState.customMahasiswa = null;
      saveState();
      closeModal();
      renderCurrentTab();
      showToast('Daftar 14 mahasiswa asli dipulihkan.', 'success');
    }

    function openSecretarySettingsModal() {
      openModal(`
        <div class="p-5 overflow-y-auto space-y-3">
          <div class="flex items-start justify-between gap-2 pb-2.5 border-b border-slate-100">
            <div>
              <span class="text-[10px] font-extrabold uppercase tracking-wider text-emerald-700">Konfigurasi Sekretaris</span>
              <h3 class="font-display font-bold text-sm text-slate-900 mt-0.5">Nomor WA Tujuan & PIN Sekretaris</h3>
            </div>
            <button onclick="closeModal()" class="p-1.5 rounded-xl bg-slate-100 text-slate-500">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
          <form onsubmit="saveSecretarySettings(event)" class="space-y-3">
            <div>
              <label class="block text-[11px] font-bold text-slate-600 mb-1">Nama Sekretaris Kelas (untuk Tanda Tangan Kop)</label>
              <input id="sec-set-nama" type="text" value="${appState.secretaryConfig?.namaSekretaris || 'Sekretaris Kelas PAI Multikultur'}" class="w-full p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs font-bold" required />
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-600 mb-1">Nomor WhatsApp Sekretaris</label>
              <input id="sec-set-phone" type="text" value="${getSecretaryPhoneDisplay()}" class="w-full p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs font-mono font-bold" required />
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-600 mb-1">PIN Login Sekretaris</label>
              <input id="sec-set-pin" type="text" maxlength="6" value="${appState.secretaryConfig?.pin || '0142'}" class="w-full p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs font-mono font-bold" required />
            </div>
            <button type="submit" class="w-full py-2.5 rounded-xl bg-emerald-800 text-white text-xs font-bold">Simpan Pengaturan</button>
          </form>
        </div>
      `);
    }

    function saveSecretarySettings(e) {
      e.preventDefault();
      appState.secretaryConfig.namaSekretaris = (document.getElementById('sec-set-nama')?.value || '').trim();
      appState.secretaryConfig.phoneRaw = (document.getElementById('sec-set-phone')?.value || '').trim();
      appState.secretaryConfig.pin = (document.getElementById('sec-set-pin')?.value || '0142').trim();
      saveState();
      closeModal();
      renderApp();
      showToast('Pengaturan Sekretaris Kelas disimpan!', 'success');
    }

    /**
     * =====================================================================
     * 15. INISIALISASI APLIKASI SAAT HALAMAN SELESAI DIMUAT
     * =====================================================================
     */
    document.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
</body>
</html>
