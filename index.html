    function getTodayISO() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function addDaysISO(days) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function formatDateIndo(isoStr) {
      if (!isoStr) return '-';
      const parts = isoStr.split('-');
      if (parts.length !== 3) return isoStr;
      const bulan = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      const mIdx = Math.max(0, Math.min(11, parseInt(parts[1], 10) - 1));
      return `${parseInt(parts[2], 10)} ${bulan[mIdx]} ${parts[0]}`;
    }

    function getDaysRemaining(deadlineISO) {
      const today = new Date(getTodayISO() + 'T00:00:00');
      const target = new Date(deadlineISO + 'T00:00:00');
      return Math.round((target - today) / (1000 * 60 * 60 * 24));
    }

          ...base,
          ...parsed,
          activeSemester: [1, 2, 3, 4].includes(Number(parsed.activeSemester)) ? Number(parsed.activeSemester) : 1,

          spinnerHistory: Array.isArray(parsed.spinnerHistory) ? parsed.spinnerHistory : []

      } catch (e) {

    function getMasterMahasiswa() {
      return Array.isArray(appState.customMahasiswa) && appState.customMahasiswa.length > 0
        ? appState.customMahasiswa
        : DEFAULT_MAHASISWA;
    }

    function getStudentByNim(nim) {
      return getMasterMahasiswa().find(m => m.nim === nim) || null;
    }

    function getStudentPin(nim) {
      if (appState.studentPins && appState.studentPins[nim]) {
        return String(appState.studentPins[nim]);
      }
      return String(nim).slice(-4);
    }

    function getSemesterMataKuliahList(smtId) {
      const s = Number(smtId || getActiveSemesterId());
      if (s === 1) {
        return Array.isArray(appState.customMataKuliah) && appState.customMataKuliah.length > 0
          ? appState.customMataKuliah
          : DEFAULT_MATA_KULIAH;
      }
      if (appState.semesterMataKuliah && Array.isArray(appState.semesterMataKuliah[s]) && appState.semesterMataKuliah[s].length > 0) {
        return appState.semesterMataKuliah[s];
      }
      return DEFAULT_NEXT_SEMESTER_MK[s] || DEFAULT_MATA_KULIAH;
    }

    function getMasterMataKuliah(smtId) {
      return getSemesterMataKuliahList(smtId || getActiveSemesterId());
    }

    function getMkById(mkId, smtId) {
      if (smtId) {
        const list = getSemesterMataKuliahList(smtId);
        const found = list.find(m => m.id === mkId);
        if (found) return found;
      }
      for (const s of [1, 2, 3, 4]) {
        const list = getSemesterMataKuliahList(s);
        const found = list.find(m => m.id === mkId);
        if (found) return found;
      }
      return getSemesterMataKuliahList(getActiveSemesterId())[0];
    }

    function getAttendanceSessionKey(smtId, mkId, pertemuan) {
      const s = Number(smtId || getActiveSemesterId());
      const p = Math.max(1, Math.min(PERTEMUAN_PER_SEMESTER, Number(pertemuan || 1)));
      return s === 1 ? `${mkId}_P${p}` : `S${s}_${mkId}_P${p}`;
    }

    function isAttendanceKeyInSemester(key, smtId) {
      const s = Number(smtId);
      if (s === 1) return !/^S[234]_/.test(key);
      return key.startsWith(`S${s}_`);
    }

    function getGroupStorageKey(smtId, mkId) {
      const s = Number(smtId || getActiveSemesterId());
      return s === 1 ? mkId : `S${s}_${mkId}`;
    }

    function parseSemesterSyncCode(text) {
      if (!text) return null;
      // Format baru 4 semester: [SYNC|S1|026112002|MK01|1|H]
      const m4 = text.match(/\[SYNC\|S([1-4])\|([0-9]+)\|([A-Za-z0-9_]+)\|([0-9]+)\|([HISA])\]/i);
      if (m4) {
        return {
          smtId: Number(m4[1]),
          nim: m4[2].trim(),
          mkId: m4[3].trim(),
          pertemuan: Math.max(1, Math.min(PERTEMUAN_PER_SEMESTER, Number(m4[4]))),
          status: m4[5].toUpperCase()
        };
      }
      // Kompatibilitas format lama Semester 1: [SYNC|026112002|MK01|1|H]
      const mLegacy = text.match(/\[SYNC\|([0-9]+)\|([A-Za-z0-9_]+)\|([0-9]+)\|([HISA])\]/i);
      if (mLegacy) {
        return {
          smtId: 1,
          nim: mLegacy[1].trim(),
          mkId: mLegacy[2].trim(),
          pertemuan: Math.max(1, Math.min(PERTEMUAN_PER_SEMESTER, Number(mLegacy[3]))),
          status: mLegacy[4].toUpperCase()
        };
      }
      return null;
    }

    function ensureSemesterSelectionConsistency(smtId) {
      const mkList = getSemesterMataKuliahList(smtId);
      if (!mkList.length) return;
      const firstId = mkList[0].id;
      if (!mkList.some(m => m.id === uiState.selectedMkId)) uiState.selectedMkId = firstId;
      if (!mkList.some(m => m.id === uiState.studentPresensiMkId)) uiState.studentPresensiMkId = firstId;
      if (!mkList.some(m => m.id === uiState.secTugasMkId)) uiState.secTugasMkId = firstId;
      if (!mkList.some(m => m.id === uiState.kelompokMkId)) {
        uiState.kelompokMkId = firstId;
        uiState.previewGroups = null;
      }
      if (!mkList.some(m => m.id === uiState.spinnerMkId)) {
        uiState.spinnerMkId = firstId;
        uiState.spinnerWinner = null;
        uiState.batchOrderResult = null;
      }
      if (uiState.rekapMkFilter !== 'ALL' && uiState.rekapMkFilter !== 'ALL_4_SMT' && !mkList.some(m => m.id === uiState.rekapMkFilter)) {
        uiState.rekapMkFilter = 'ALL';
      }
    }

    function switchActiveSemester(smtId) {
      const nextSmt = Number(smtId);
      if (![1, 2, 3, 4].includes(nextSmt)) return;
      appState.activeSemester = nextSmt;
      ensureSemesterSelectionConsistency(nextSmt);
      saveState();
      renderApp();
      showToast(`Beralih ke ${getSemesterInfo(nextSmt).fullLabel}`, 'info');
    }

    function normalizePhoneToWa62(raw) {
      const digits = String(raw || '').replace(/\D/g, '');
      if (!digits) return '6282197900142';
      if (digits.startsWith('62')) return digits;
      if (digits.startsWith('0')) return '62' + digits.slice(1);
      return '62' + digits;
    }

    function getSecretaryPhoneDisplay() {
      const digits = String(appState.secretaryConfig?.phoneRaw || '082197900142').replace(/\D/g, '');
      if (!digits) return '0821-9790-0142';
      const local = digits.startsWith('62') ? '0' + digits.slice(2) : digits;
      if (local.length >= 10) {
        return `${local.slice(0, 4)}-${local.slice(4, 8)}-${local.slice(8)}`;
      }
      return local;
    }

    function getSecretaryRawDigits() {
      const digits = String(appState.secretaryConfig?.phoneRaw || '082197900142').replace(/\D/g, '');
      if (!digits) return '082197900142';
      return digits.startsWith('62') ? '0' + digits.slice(2) : digits;
    }

    function getStudentPersonalStats(nim, smtFilter = null) {
      const targetSmt = smtFilter === null ? getActiveSemesterId() : smtFilter;
      const keys = Object.keys(appState.attendance).filter(k => {
        if (targetSmt === 'ALL') return true;
        return isAttendanceKeyInSemester(k, targetSmt);
      });

      let h = 0, i = 0, s = 0, a = 0, totalSessions = 0;
      keys.forEach(k => {
        const recs = appState.attendance[k]?.records || {};
        if (Object.keys(recs).length > 0) {
          totalSessions++;
          const st = recs[nim];
          if (st === 'H') h++;
          else if (st === 'I') i++;
          else if (st === 'S') s++;
          else if (st === 'A') a++;
        }
      });

      const pctHadir = totalSessions > 0 ? Math.round((h / totalSessions) * 100) : 0;
      return { h, i, s, a, totalSessions, pctHadir };
    }

    function getPendingTagihanCountForCurrentUser() {
      const activeSmt = getActiveSemesterId();
      if (appState.session?.role === 'student') {
        const nim = appState.session.nim;
        return appState.assignments.filter(tgs => {
          if (tgs.ownerNim && tgs.ownerNim !== nim) return false;
          const smt = Number(tgs.smtId || 1);
          if (smt !== activeSmt) return false;
          return !tgs.submissions?.[nim]?.done;
        }).length;
      }
      if (appState.session?.role === 'secretary') {
        const mhsList = getMasterMahasiswa();
        return appState.assignments.filter(tgs => {
          if (tgs.ownerNim) return false;
          const smt = Number(tgs.smtId || 1);
          if (smt !== activeSmt) return false;
          return mhsList.some(m => !tgs.submissions?.[m.nim]?.done);
        }).length;
      }
      return 0;
    }

    /**

     * 4. UI HELPERS: TOAST, MODAL, CLIPBOARD, WHATSAPP LAUNCHER & PRINT PDF
     * =====================================================================

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const styles = {
        success: 'bg-emerald-900 text-white border-emerald-700',
        error: 'bg-rose-900 text-white border-rose-700',
        info: 'bg-slate-900 text-white border-slate-700'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-3.5 py-2.5 rounded-2xl border shadow-xl text-xs font-semibold flex items-center justify-between gap-2 animate-fade-up ${styles[type] || styles.info}`;
      el.innerHTML = `<span>${message}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.25s ease';
        setTimeout(() => el.remove(), 260);
      }, 2800);
    }

    function openModal(innerHtml) {
      const backdrop = document.getElementById('modal-backdrop');
      const box = document.getElementById('modal-box');
      if (!backdrop || !box) return;
      box.innerHTML = innerHtml;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
      if (window.lucide) window.lucide.createIcons();
    }

    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      if (!backdrop) return;
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
    }

    document.getElementById('modal-backdrop')?.addEventListener('click', (e) => {
      if (e.target.id === 'modal-backdrop') closeModal();
    });

    function copyTextToClipboard(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('Teks berhasil disalin ke clipboard!', 'success');
      } catch (err) {
        showToast('Gagal menyalin otomatis. Silakan salin manual.', 'error');
      }
      document.body.removeChild(ta);
    }

    function fillDefaultLoginPin() {
      const inp = document.getElementById('login-pin-input');
      if (!inp) return;
      if (uiState.loginRole === 'student') {
        const nim = document.getElementById('login-student-nim')?.value || uiState.loginNim;
        inp.value = getStudentPin(nim);
      } else {
        inp.value = appState.secretaryConfig?.pin || '0142';
      }
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const pinVal = (document.getElementById('login-pin-input')?.value || '').trim();
      if (uiState.loginRole === 'student') {
        const nim = document.getElementById('login-student-nim')?.value || uiState.loginNim;
        const mhs = getStudentByNim(nim);
        if (!mhs) {
          showToast('Data mahasiswa tidak ditemukan.', 'error');
          return;
        }
        const expected = getStudentPin(nim);
        if (pinVal !== expected) {
          showToast('PIN salah. Klik "Isi PIN Default" jika lupa PIN.', 'error');
          return;
        }
        appState.session = { role: 'student', nim: mhs.nim };
        uiState.activeTab = 'beranda';
        saveState();
        renderApp();
        showToast(`Selamat datang, ${mhs.nama}!`, 'success');
      } else {
        const expectedSec = String(appState.secretaryConfig?.pin || '0142');
        if (pinVal !== expectedSec) {
          showToast('PIN Sekretaris Kelas tidak sesuai.', 'error');
          return;
        }
        appState.session = { role: 'secretary', nim: null };
        uiState.activeTab = 'beranda';
        saveState();
        renderApp();
        showToast('Berhasil masuk sebagai Sekretaris Kelas!', 'success');
      }
    }

    function logoutSession() {
      appState.session = { role: null, nim: null };
      saveState();
      renderApp();
      showToast('Anda telah keluar dari portal.', 'info');
    }

    function switchTab(tabId) {
      uiState.activeTab = tabId;
      document.querySelectorAll('[data-nav-tab]').forEach(btn => {
        const isAct = btn.getAttribute('data-nav-tab') === tabId;
        btn.className = `relative py-1.5 px-1 rounded-xl flex flex-col items-center justify-center gap-0.5 transition ${isAct ? 'bg-emerald-50 text-emerald-900 font-extrabold' : 'text-slate-500 font-semibold hover:bg-slate-50'}`;
      });
      renderCurrentTab();
      const mainEl = document.getElementById('main-content');
      if (mainEl) mainEl.scrollTop = 0;
    }

    function renderCurrentTab() {
      const container = document.getElementById('main-content');
      if (!container) return;
      const isSecretary = appState.session?.role === 'secretary';

      if (isSecretary) {
        if (uiState.activeTab === 'beranda') container.innerHTML = renderSecretaryBerandaTab();
        else if (uiState.activeTab === 'presensi') container.innerHTML = renderSecretaryPresensiTab();
        else if (uiState.activeTab === 'tugas') container.innerHTML = renderSecretaryTugasTab();
        else if (uiState.activeTab === 'kelompok') container.innerHTML = renderSecretaryKelompokTab();
        else if (uiState.activeTab === 'pengingat') container.innerHTML = renderSecretaryPengingatTab();
      } else {
        if (uiState.activeTab === 'beranda') container.innerHTML = renderStudentBerandaTab();
        else if (uiState.activeTab === 'presensi') container.innerHTML = renderStudentPresensiTab();
        else if (uiState.activeTab === 'tugas') container.innerHTML = renderStudentTugasTab();
        else if (uiState.activeTab === 'kelompok') container.innerHTML = renderStudentKelompokTab();
        else if (uiState.activeTab === 'pengingat') container.innerHTML = renderStudentTagihanTab();
      }

      if (window.lucide) window.lucide.createIcons();
    }

    function submitStudentSelfAttendance(e) {
      e.preventDefault();
      const mhs = getStudentByNim(appState.session.nim);
      if (!mhs) return;
      const activeSmt = getActiveSemesterId();
      const smtInfo = getSemesterInfo(activeSmt);
      const mkId = document.getElementById('stu-att-mk')?.value || uiState.studentPresensiMkId;
      const pertemuan = Number(document.getElementById('stu-att-pert')?.value || uiState.studentPresensiPertemuan);
      const metode = document.getElementById('stu-att-metode')?.value || 'Tatap Muka';
      const ket = (document.getElementById('stu-att-ket')?.value || '').trim();
      const statusEl = document.querySelector('input[name="stu-att-status"]:checked');
      const status = statusEl ? statusEl.value : 'H';

      const mk = getMkById(mkId, activeSmt);
      const key = getAttendanceSessionKey(activeSmt, mkId, pertemuan);
      if (!appState.attendance[key]) {
        appState.attendance[key] = { tanggal: getTodayISO(), topik: `Pertemuan ke-${pertemuan}`, records: {} };
      }
      appState.attendance[key].records[mhs.nim] = status;

      appState.studentSelfLogs.unshift({
        id: 'LOG-' + Date.now(),
        smtId: activeSmt,
        nim: mhs.nim,
        mkId,
        pertemuan,
        status,
        metode,
        ket,
        tanggal: getTodayISO()
      });
      saveState();

      const statusLabelMap = { H: 'HADIR (H)', I: 'IZIN (I)', S: 'SAKIT (S)', A: 'ALPA (A)' };
      const syncCode = `[SYNC|S${activeSmt}|${mhs.nim}|${mkId}|${pertemuan}|${status}]`;
      const teks = [
        `*LAPORAN PRESENSI MANDIRI MAHASISWA*`,
        `${INSTITUSI_INFO.program} - ${INSTITUSI_INFO.institusi}`,
        `------------------------------------`,
        `👤 *Nama:* ${mhs.nama}`,
        `🆔 *NIM:* ${mhs.nim}`,
        `🎓 *Periode:* ${smtInfo.fullLabel}`,
        `📚 *Mata Kuliah:* ${mk.nama}`,
        `🗓️ *Pertemuan:* Ke-${pertemuan} (${formatDateIndo(getTodayISO())})`,
        `📍 *Metode:* ${metode}`,
        `✅ *Status:* *${statusLabelMap[status] || status}*`,
        ket ? `📝 *Keterangan:* ${ket}` : null,
        `------------------------------------`,
        `Kode Sinkronisasi Sekretaris:`,
        syncCode
      ].filter(Boolean).join('\n');

      launchWhatsAppMessage('Kirim Presensi Mandiri ke Sekretaris', teks);
    }

    function sendStudentFullRecapToSecretaryWA() {
      const mhs = getStudentByNim(appState.session.nim);
      if (!mhs) return;
      const activeSmt = getActiveSemesterId();
      const smtInfo = getSemesterInfo(activeSmt);
      const stats = getStudentPersonalStats(mhs.nim, activeSmt);
      const mkList = getMasterMataKuliah(activeSmt);

      const mkLines = mkList.map(mk => {
        let h = 0, tot = 0;
        for (let p = 1; p <= PERTEMUAN_PER_SEMESTER; p++) {
          const k = getAttendanceSessionKey(activeSmt, mk.id, p);
          const recs = appState.attendance[k]?.records || {};
          if (Object.keys(recs).length > 0) {
            tot++;
            if (recs[mhs.nim] === 'H') h++;
          }
        }
        return `${mk.idx}. ${mk.nama}: Hadir ${h}/${tot} pert`;
      });

      const teks = [
        `*REKAP KEHADIRAN PRIBADI MAHASISWA*`,
        `${INSTITUSI_INFO.program} - ${INSTITUSI_INFO.institusi}`,
        `------------------------------------`,
        `👤 *Nama:* ${mhs.nama} (${mhs.nim})`,
        `🎓 *Periode:* ${smtInfo.fullLabel}`,
        `📊 *Total:* Hadir ${stats.h} | Izin ${stats.i} | Sakit ${stats.s} | Alpa ${stats.a} (${stats.pctHadir}%)`,
        `------------------------------------`,
        ...mkLines
      ].join('\n');

      launchWhatsAppMessage('Kirim Rekap Kehadiran Saya ke Sekretaris', teks);
    }

    function updateStudentOwnMkTask(mkId, field, value) {
      const nim = appState.session?.nim;
      if (!nim) return;
      if (!appState.studentMkTasks[nim]) appState.studentMkTasks[nim] = {};
      if (!appState.studentMkTasks[nim][mkId]) {
        appState.studentMkTasks[nim][mkId] = { mandiriJudul: '', mandiriStatus: 'Belum', presentasiJudul: '', presentasiStatus: 'Belum', catatan: '' };
      }
      appState.studentMkTasks[nim][mkId][field] = value.trim();
      saveState();
      showToast('Catatan judul tugas MK disimpan!', 'success');
    }

        .filter(tgs => {

                ${smtInfo.label} (TP ${smtInfo.tp})

              <button type="button" onclick="uiState.studentTagihanScope='ALL_SMT'; renderCurrentTab();" class="py-1.5 rounded-xl text-[11px] font-extrabold transition ${uiState.studentTagihanScope === 'ALL_SMT' ? 'bg-white text-emerald-900 shadow-xs' : 'text-slate-600'}">
                Semua Semester
              </button>
            </div>

            <div class="flex gap-1.5">
              ${[
                { id: 'ALL', label: `Semua (${accessible.length})` },
                { id: 'PENDING', label: `Belum (${pendingCount})` },
                { id: 'DONE', label: `Selesai (${doneCount})` }
              ].map(f => `
                <button type="button" onclick="uiState.studentTagihanFilter='${f.id}'; renderCurrentTab();" class="flex-1 py-1.5 px-2 rounded-xl text-[10.5px] font-extrabold border transition ${uiState.studentTagihanFilter === f.id ? 'bg-emerald-800 text-white border-emerald-800' : 'bg-white text-slate-600 border-slate-200'}">
                  ${f.label}
                </button>
              `).join('')}
            </div>
          </div>

          <!-- Daftar Kartu Tagihan -->
          ${filtered.length === 0 ? `
            <div class="bg-white rounded-2xl border border-slate-200 p-6 text-center space-y-1.5">
              <p class="font-display font-bold text-xs text-slate-800">Tidak ada tagihan pada filter ini</p>
              <p class="text-[11px] text-slate-500">Semua tagihan telah selesai atau belum ada tenggat baru.</p>
            </div>
          ` : `
            <div class="space-y-3">
              ${filtered.map(tgs => {
                const smtTgs = Number(tgs.smtId || 1);
                const mk = getMkById(tgs.mkId, smtTgs);
                const sub = tgs.submissions?.[mhs.nim] || { done: false, score: '', note: '', submittedAt: '' };
                const days = getDaysRemaining(tgs.deadline);
                const isPersonal = tgs.ownerNim === mhs.nim;

                let statusBadge = '';
                if (sub.done) {
                  statusBadge = `<span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-emerald-100 text-emerald-800 shrink-0">✓ Sudah Kumpul</span>`;
                } else if (days < 0) {
                  statusBadge = `<span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-rose-100 text-rose-800 shrink-0">Terlewat ${Math.abs(days)}h</span>`;
                } else if (days === 0) {
                  statusBadge = `<span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-rose-600 text-white shrink-0">Hari Ini!</span>`;
                } else if (days <= 3) {
                  statusBadge = `<span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-amber-100 text-amber-900 shrink-0">Mendesak H-${days}</span>`;
                } else {
                  statusBadge = `<span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-sky-100 text-sky-800 shrink-0">H-${days}</span>`;
                }

                const mkTaskEntry = appState.studentMkTasks?.[mhs.nim]?.[tgs.mkId] || {};
                const recordedTitle = tgs.kategori === 'Presentasi' ? mkTaskEntry.presentasiJudul : mkTaskEntry.mandiriJudul;

                return `
                  <div class="bg-white rounded-2xl border ${sub.done ? 'border-emerald-200/90' : days <= 2 ? 'border-amber-300' : 'border-slate-200/90'} p-3.5 shadow-xs space-y-2.5">
                    <div class="flex items-start justify-between gap-2">
                      <div class="min-w-0">
                        <div class="flex flex-wrap items-center gap-1">
                          <span class="text-[9.5px] font-extrabold text-emerald-700">${tgs.kategori}</span>
                          <span class="text-[9.5px] text-slate-400">•</span>
                          <span class="text-[9.5px] font-bold text-slate-500">Smt ${smtTgs}</span>
                          ${isPersonal ? `<span class="px-1.5 py-0.2 rounded bg-purple-100 text-purple-800 text-[9px] font-extrabold">Pribadi</span>` : ''}
                        </div>
                        <h3 class="font-display font-bold text-xs text-slate-900 mt-0.5 leading-snug">${tgs.judul}</h3>
                        <p class="text-[10.5px] text-slate-500 mt-0.5 truncate">${mk?.nama || '-'}</p>
                      </div>
                      ${statusBadge}
                    </div>

                    ${recordedTitle ? `
                      <div class="p-2 rounded-xl bg-slate-50 border border-slate-200/80 text-[10.5px] text-slate-700">
                        <span class="font-bold text-emerald-800">Judul Anda di Tugas MK:</span> ${recordedTitle}
                      </div>
                    ` : ''}

                    ${sub.note ? `
                      <div class="p-2 rounded-xl bg-emerald-50/60 border border-emerald-200/70 text-[10.5px] text-emerald-950">
                        <span class="font-bold">Catatan Kumpul:</span> ${sub.note}
                      </div>
                    ` : ''}

                    <div class="flex items-center justify-between text-[11px] text-slate-600 pt-1.5 border-t border-slate-100">
                      <span>Tenggat: <strong class="text-slate-900">${formatDateIndo(tgs.deadline)}</strong></span>
                      ${sub.score !== '' && sub.score !== undefined ? `<span class="px-2 py-0.5 rounded-lg bg-emerald-800 text-amber-300 font-mono font-extrabold text-[10.5px]">Nilai: ${sub.score}</span>` : ''}
                    </div>

                    ${!sub.done ? `
                      <div class="grid grid-cols-2 gap-2 pt-0.5">
                        <button type="button" onclick="toggleStudentOwnTagihanStatus('${tgs.id}', true)" class="py-2 px-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-[11px] font-extrabold">
                          ✓ Tandai Selesai
                        </button>
                        <button type="button" onclick="openStudentSubmitTagihanModal('${tgs.id}')" class="py-2 px-2.5 rounded-xl bg-emerald-800 hover:bg-emerald-900 text-white text-[11px] font-extrabold shadow-xs flex items-center justify-center gap-1">
                          <i data-lucide="send" class="w-3 h-3 text-amber-300"></i>
                          <span>Kumpul & WA</span>
                        </button>
                      </div>
                    ` : `
                      <div class="flex items-center justify-between gap-2 pt-0.5">
                        <button type="button" onclick="toggleStudentOwnTagihanStatus('${tgs.id}', false)" class="px-2.5 py-1.5 rounded-xl bg-slate-100 text-slate-600 text-[10.5px] font-bold">
                          Batalkan Status
                        </button>
                        <button type="button" onclick="confirmStudentAssignmentWA('${tgs.id}', '${(sub.note || '').replace(/'/g, "\\'")}')" class="px-3 py-1.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-900 text-[10.5px] font-extrabold">
                          Kirim Ulang Konfirmasi WA
                        </button>
                      </div>
                    `}

                    ${isPersonal ? `
                      <div class="flex justify-end">
                        <button type="button" onclick="deleteStudentPersonalReminder('${tgs.id}')" class="text-[10px] font-bold text-rose-600 hover:underline">
                          Hapus Pengingat Pribadi
                        </button>
                      </div>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

    function submitStudentPersonalReminder(e) {
      e.preventDefault();
      const mhs = getStudentByNim(appState.session.nim);
      if (!mhs) return;
      const mkId = document.getElementById('stu-rem-mk')?.value || 'MK01';
      const kategori = document.getElementById('stu-rem-kat')?.value || 'Tugas Mandiri';
      const deadline = document.getElementById('stu-rem-deadline')?.value || addDaysISO(3);
      const judul = (document.getElementById('stu-rem-judul')?.value || '').trim();
      if (!judul) return;

      appState.assignments.unshift({
        id: 'PRB-' + Date.now(),
        smtId: getActiveSemesterId(),
        ownerNim: mhs.nim,
        mkId,
        kategori,
        judul,
        deadline,
        submissions: {
          [mhs.nim]: { done: false, score: '', note: '', submittedAt: '' }
        }
      });
      uiState.showStudentAddReminderForm = false;
      saveState();
      renderApp();
      showToast('Pengingat pribadi berhasil ditambahkan!', 'success');
    }

    function deleteStudentPersonalReminder(tugasId) {
      appState.assignments = appState.assignments.filter(a => a.id !== tugasId);
      saveState();
      renderApp();
      showToast('Pengingat pribadi dihapus.', 'info');
    }

    function toggleStudentOwnTagihanStatus(tugasId, isDone) {
      const mhs = getStudentByNim(appState.session.nim);
      const tgs = appState.assignments.find(a => a.id === tugasId);
      if (!mhs || !tgs) return;
      if (!tgs.submissions) tgs.submissions = {};
      if (!tgs.submissions[mhs.nim]) tgs.submissions[mhs.nim] = { done: false, score: '', note: '', submittedAt: '' };
      tgs.submissions[mhs.nim].done = isDone;
      tgs.submissions[mhs.nim].submittedAt = isDone ? getTodayISO() : '';
      saveState();
      renderApp();
      showToast(isDone ? 'Tagihan ditandai sudah dikumpulkan!' : 'Status pengumpulan dibatalkan.', isDone ? 'success' : 'info');
    }

    function openStudentSubmitTagihanModal(tugasId) {
      const mhs = getStudentByNim(appState.session.nim);
      const tgs = appState.assignments.find(a => a.id === tugasId);
      if (!mhs || !tgs) return;
      const mk = getMkById(tgs.mkId, tgs.smtId || 1);
      const mkTaskEntry = appState.studentMkTasks?.[mhs.nim]?.[tgs.mkId] || {};
      const defaultTitle = (tgs.kategori === 'Presentasi' ? mkTaskEntry.presentasiJudul : mkTaskEntry.mandiriJudul) || '';
      const existingNote = tgs.submissions?.[mhs.nim]?.note || defaultTitle;

      openModal(`
        <div class="p-5 overflow-y-auto space-y-3">
          <div class="flex items-start justify-between gap-2 pb-2.5 border-b border-slate-100">
            <div>
              <span class="text-[10px] font-extrabold uppercase tracking-wider text-emerald-700">Konfirmasi Pengumpulan Tugas</span>
              <h3 class="font-display font-bold text-sm text-slate-900 mt-0.5">${tgs.judul}</h3>
              <p class="text-[11px] text-slate-500">${mk?.nama || '-'}</p>
            </div>
            <button type="button" onclick="closeModal()" class="p-1.5 rounded-xl bg-slate-100 text-slate-500">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>

          <form onsubmit="processStudentSubmitTagihan(event, '${tgs.id}')" class="space-y-3">
            <div>
              <label class="block text-[11px] font-bold text-slate-700 mb-1">Judul Makalah / Tautan File / Catatan Pengumpulan</label>
              <textarea id="stu-submit-note" rows="3" placeholder="Tulis judul makalah yang dikumpulkan, tautan Google Drive, atau keterangan penyerahan..." class="w-full p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs">${existingNote}</textarea>
              <p class="text-[10px] text-slate-500 mt-1">Status Anda akan otomatis ditandai <strong>Sudah Kumpul</strong> dan menyiapkan pesan WA dengan kode sinkronisasi untuk Sekretaris.</p>
            </div>
            <div class="flex gap-2">
              <button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold">Batal</button>
              <button type="submit" class="flex-1 py-2.5 rounded-xl bg-emerald-800 text-white text-xs font-extrabold shadow-xs">Simpan & Kirim WA</button>
            </div>
          </form>
        </div>
      `);
    }

    function processStudentSubmitTagihan(e, tugasId) {
      e.preventDefault();
      const mhs = getStudentByNim(appState.session.nim);
      const tgs = appState.assignments.find(a => a.id === tugasId);
      if (!mhs || !tgs) return;
      const note = (document.getElementById('stu-submit-note')?.value || '').trim();

      if (!tgs.submissions) tgs.submissions = {};
      if (!tgs.submissions[mhs.nim]) tgs.submissions[mhs.nim] = { done: false, score: '', note: '', submittedAt: '' };
      tgs.submissions[mhs.nim].done = true;
      tgs.submissions[mhs.nim].submittedAt = getTodayISO();
      tgs.submissions[mhs.nim].note = note;

      saveState();
      closeModal();
      renderApp();
      confirmStudentAssignmentWA(tugasId, note);
    }

    function confirmStudentAssignmentWA(tugasId, customNote = '') {
      const mhs = getStudentByNim(appState.session.nim);
      const tgs = appState.assignments.find(a => a.id === tugasId);
      if (!mhs || !tgs) return;
      const smtTgs = Number(tgs.smtId || 1);
      const smtInfo = getSemesterInfo(smtTgs);
      const mk = getMkById(tgs.mkId, smtTgs);
      const noteFinal = customNote || tgs.submissions?.[mhs.nim]?.note || '';
      const syncCode = `[TASK_SYNC|${tgs.id}|${mhs.nim}|DONE]`;

      const teks = [
        `*KONFIRMASI PENGUMPULAN TUGAS*`,
        `${INSTITUSI_INFO.program} - ${INSTITUSI_INFO.institusi}`,
        `------------------------------------`,
        `👤 *Nama:* ${mhs.nama} (${mhs.nim})`,
        `🎓 *Periode:* ${smtInfo.fullLabel}`,
        `📚 *Mata Kuliah:* ${mk?.nama || '-'}`,
        `📌 *Tagihan:* ${tgs.judul} (${tgs.kategori})`,
        `✅ *Status:* Sudah Dikumpulkan (${formatDateIndo(getTodayISO())})`,
        noteFinal ? `📝 *Judul/Keterangan:* ${noteFinal}` : null,
        `------------------------------------`,
        `Kode Sinkronisasi Sekretaris:`,
        syncCode
      ].filter(Boolean).join('\n');
      launchWhatsAppMessage('Konfirmasi Tugas ke Sekretaris', teks);
    }

    /**
     * =====================================================================
     * 9. MODE SEKRETARIS: MODUL TUGAS MK, NILAI KELAS & CATATAN PERKULIAHAN
     * =====================================================================
     */
    function renderSecretaryTugasTab() {
      const mhsList = getMasterMahasiswa();
      const activeSmt = getActiveSemesterId();
      const smtInfo = getSemesterInfo(activeSmt);
      const mkList = getMasterMataKuliah(activeSmt);
      if (!mkList.some(m => m.id === uiState.secTugasMkId)) {
        uiState.secTugasMkId = mkList[0]?.id || 'MK01';
      }

      return `
        <div class="space-y-4 animate-fade-up">
          <div>
            <h2 class="font-display font-bold text-base text-slate-900">Tugas Mandiri & Presentasi (${smtInfo.label})</h2>
            <p class="text-[11px] text-slate-500">${smtInfo.fullLabel} • Pantau judul mahasiswa, nilai & catatan</p>
          </div>

          <div class="grid grid-cols-3 gap-1 p-1 rounded-2xl bg-slate-200/70">
            <button type="button" onclick="uiState.tugasSubTab='mk_titles'; renderCurrentTab();" class="py-2 rounded-xl text-[11px] font-extrabold transition ${uiState.tugasSubTab === 'mk_titles' ? 'bg-white text-emerald-900 shadow-xs' : 'text-slate-600'}">
              Judul Mhs
            </button>
            <button type="button" onclick="uiState.tugasSubTab='kelas'; renderCurrentTab();" class="py-2 rounded-xl text-[11px] font-extrabold transition ${uiState.tugasSubTab === 'kelas' ? 'bg-white text-emerald-900 shadow-xs' : 'text-slate-600'}">
              Tugas & Nilai
            </button>
            <button type="button" onclick="uiState.tugasSubTab='catatan'; renderCurrentTab();" class="py-2 rounded-xl text-[11px] font-extrabold transition ${uiState.tugasSubTab === 'catatan' ? 'bg-white text-emerald-900 shadow-xs' : 'text-slate-600'}">
              Catatan MK
            </button>
          </div>

          ${uiState.tugasSubTab === 'mk_titles' ? `
            <section class="bg-white rounded-2xl border border-slate-200/90 p-3.5 shadow-xs space-y-3">
              <div>
                <label class="block text-[11px] font-bold text-slate-600 mb-1">Pilih Mata Kuliah (${smtInfo.label})</label>
                <select onchange="uiState.secTugasMkId=this.value; renderCurrentTab();" class="w-full p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs font-bold text-slate-800">
                  ${mkList.map(mk => `<option value="${mk.id}" ${uiState.secTugasMkId === mk.id ? 'selected' : ''}>${mk.idx}. ${mk.nama}</option>`).join('')}
                </select>
              </div>
              <button type="button" onclick="shareSecMkTitlesRecapWA()" class="w-full py-2 px-3 rounded-xl bg-emerald-800 text-white text-xs font-extrabold">
                Salin / Kirim Rekap Judul Tugas MK Ini ke WA
              </button>
            </section>

            <div class="space-y-2.5">
              ${mhsList.map(m => {
                const e = appState.studentMkTasks?.[m.nim]?.[uiState.secTugasMkId] || { mandiriJudul: '', mandiriStatus: 'Belum', presentasiJudul: '', presentasiStatus: 'Belum' };
                return `
                  <div class="bg-white rounded-2xl border border-slate-200/90 p-3 shadow-xs space-y-2">
                    <div class="flex items-center justify-between">
                      <p class="text-xs font-bold text-slate-900">${m.no}. ${m.nama}</p>
                      <span class="text-[10px] font-mono text-slate-400">${m.nim}</span>
                    </div>
                    <div class="grid grid-cols-1 gap-1.5">
                      <input type="text" value="${(e.mandiriJudul || '').replace(/"/g, '&quot;')}" onchange="updateSecStudentMkTitle('${m.nim}', '${uiState.secTugasMkId}', 'mandiriJudul', this.value)" placeholder="Judul Tugas Mandiri..." class="w-full px-2.5 py-1.5 rounded-lg bg-slate-50 border border-slate-200 text-[11px]" />
                      <input type="text" value="${(e.presentasiJudul || '').replace(/"/g, '&quot;')}" onchange="updateSecStudentMkTitle('${m.nim}', '${uiState.secTugasMkId}', 'presentasiJudul', this.value)" placeholder="Judul Presentasi..." class="w-full px-2.5 py-1.5 rounded-lg bg-slate-50 border border-slate-200 text-[11px]" />
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          ` : uiState.tugasSubTab === 'kelas' ? renderSecretaryKelasAssignmentsPanel() : renderSecretaryCourseNotesPanel()}
        </div>
      `;
    }

    function updateSecStudentMkTitle(nim, mkId, field, value) {
      if (!appState.studentMkTasks[nim]) appState.studentMkTasks[nim] = {};
      if (!appState.studentMkTasks[nim][mkId]) {
        appState.studentMkTasks[nim][mkId] = { mandiriJudul: '', mandiriStatus: 'Belum', presentasiJudul: '', presentasiStatus: 'Belum', catatan: '' };
      }
      appState.studentMkTasks[nim][mkId][field] = value.trim();
      saveState();
      showToast('Judul tugas mahasiswa diperbarui.', 'success');
    }

    function shareSecMkTitlesRecapWA() {
      const activeSmt = getActiveSemesterId();
      const smtInfo = getSemesterInfo(activeSmt);
      const mk = getMkById(uiState.secTugasMkId, activeSmt);
      const lines = getMasterMahasiswa().map(m => {
        const e = appState.studentMkTasks?.[m.nim]?.[uiState.secTugasMkId] || {};
        return `${m.no}. *${m.nama}*\n   - Mandiri: ${e.mandiriJudul || '-'}\n   - Presentasi: ${e.presentasiJudul || '-'}`;
      });
      const teks = [
        `*REKAP JUDUL TUGAS MANDIRI & PRESENTASI*`,
        `${INSTITUSI_INFO.program} - ${INSTITUSI_INFO.institusi}`,
        `🎓 *Periode:* ${smtInfo.fullLabel}`,
        `📚 *Mata Kuliah:* ${mk.nama}`,
        `------------------------------------`,
        ...lines
      ].join('\n\n');
      launchWhatsAppMessage('Rekap Judul Tugas Mahasiswa', teks);
    }

      const mhsList = getMasterMahasiswa();
      return `
        <div class="space-y-3">
          <div class="flex justify-end">
            <button type="button" onclick="uiState.showAddTugasForm=!uiState.showAddTugasForm; renderCurrentTab();" class="px-3 py-2 rounded-xl bg-emerald-800 text-white text-xs font-bold">
              ${uiState.showAddTugasForm ? 'Tutup Form' : '+ Tambah Tugas Kelas'}
            </button>
          </div>
          ${uiState.showAddTugasForm ? `
            <form onsubmit="submitNewReminder(event)" class="bg-white rounded-2xl border border-emerald-200 p-3.5 space-y-2.5">
              <select id="rem-mk" class="w-full p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs font-bold">
                ${getMasterMataKuliah(getActiveSemesterId()).map(mk => `<option value="${mk.id}">${mk.idx}. ${mk.nama}</option>`).join('')}
              </select>
              <div class="grid grid-cols-2 gap-2">
                <select id="rem-kat" class="w-full p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs font-bold">

                  <option value="Presentasi">Presentasi</option>
                </select>

              <input id="rem-judul" type="text" placeholder="Judul tugas kelas..." class="w-full p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs" required />
              <button type="submit" class="w-full py-2.5 rounded-xl bg-emerald-800 text-white text-xs font-bold">Simpan Tugas</button>
            </form>
          ` : ''}
          ${appState.assignments.map(tgs => {
            const mk = getMkById(tgs.mkId, tgs.smtId || 1);
            const doneCount = mhsList.filter(m => tgs.submissions?.[m.nim]?.done).length;
            return `
              <div class="bg-white rounded-2xl border border-slate-200/90 p-3.5 shadow-xs space-y-2.5">
                <div class="flex items-start justify-between gap-2">
                  <div>
                    <span class="text-[10px] font-extrabold text-emerald-700">${tgs.kategori} • ${mk?.nama || ''}</span>
                    <h4 class="font-display font-bold text-xs text-slate-900 mt-0.5">${tgs.judul}</h4>
                  </div>
                  <span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-[10px] font-extrabold shrink-0">${doneCount}/${mhsList.length}</span>
                </div>
                <div class="space-y-1.5 max-h-60 overflow-y-auto pr-1">
                  ${mhsList.map(m => {
                    const sub = tgs.submissions?.[m.nim] || { done: false, score: '' };
                    return `
                      <div class="p-2 rounded-xl bg-slate-50 border border-slate-200/80 flex items-center justify-between gap-2 text-[11px]">
                        <label class="flex items-center gap-2 min-w-0 cursor-pointer">
                          <input type="checkbox" ${sub.done ? 'checked' : ''} onchange="toggleAssignmentSubmission('${tgs.id}', '${m.nim}', this.checked)" class="w-4 h-4 accent-emerald-700 rounded" />
                          <span class="truncate font-semibold ${sub.done ? 'text-slate-900' : 'text-slate-500'}">${m.no}. ${m.nama}</span>
                        </label>
                        <input type="number" min="0" max="100" value="${sub.score}" placeholder="Nilai" onchange="updateAssignmentScore('${tgs.id}', '${m.nim}', this.value)" class="w-16 px-2 py-1 rounded-lg bg-white border border-slate-200 text-center font-mono font-bold text-xs" />
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>

          }).join('')}
        </div>

    function toggleAssignmentSubmission(tugasId, nim, isDone) {
      const tgs = appState.assignments.find(a => a.id === tugasId);
      if (!tgs) return;
      if (!tgs.submissions) tgs.submissions = {};
      if (!tgs.submissions[nim]) tgs.submissions[nim] = { done: false, score: '' };
      tgs.submissions[nim].done = isDone;
      saveState();
      renderCurrentTab();
    }

    function updateAssignmentScore(tugasId, nim, scoreVal) {
      const tgs = appState.assignments.find(a => a.id === tugasId);
      if (!tgs) return;
      if (!tgs.submissions) tgs.submissions = {};
      if (!tgs.submissions[nim]) tgs.submissions[nim] = { done: true, score: '' };
      tgs.submissions[nim].score = scoreVal;
      if (scoreVal !== '') tgs.submissions[nim].done = true;
      saveState();
      showToast('Nilai tugas disimpan.', 'success');
    }

    function submitNewCourseNote(e) {
      e.preventDefault();
      const mkId = document.getElementById('note-mk')?.value || 'MK01';
      const judul = (document.getElementById('note-judul')?.value || '').trim();
      const isi = (document.getElementById('note-isi')?.value || '').trim();
      if (!judul || !isi) return;
      appState.courseNotes.unshift({
        id: 'NOTE-' + Date.now(),
        smtId: getActiveSemesterId(),
        mkId,
        judul,
        isi,
        updatedAt: getTodayISO()
      });
      uiState.showAddNoteForm = false;
      saveState();
      renderCurrentTab();
      showToast('Catatan perkuliahan disimpan!', 'success');

      appState.courseNotes = appState.courseNotes.filter(n => n.id !== id);
      saveState();
      renderCurrentTab();
      showToast('Catatan dihapus.', 'info');

    function updateSessionMeta(field, value) {
      const activeSmt = getActiveSemesterId();
      const key = getAttendanceSessionKey(activeSmt, uiState.selectedMkId, uiState.selectedPertemuan);
      if (!appState.attendance[key]) {
        appState.attendance[key] = { tanggal: getTodayISO(), topik: '', records: {} };
      }
      appState.attendance[key][field] = value;
      saveState();
    }

    function setStudentAttendanceStatus(nim, status) {
      const activeSmt = getActiveSemesterId();
      const key = getAttendanceSessionKey(activeSmt, uiState.selectedMkId, uiState.selectedPertemuan);
      if (!appState.attendance[key]) {
        appState.attendance[key] = { tanggal: getTodayISO(), topik: '', records: {} };
      }
      appState.attendance[key].records[nim] = status;
      saveState();
      renderCurrentTab();
    }

    function setAllPresentForSession() {
      const activeSmt = getActiveSemesterId();
      const key = getAttendanceSessionKey(activeSmt, uiState.selectedMkId, uiState.selectedPertemuan);
      if (!appState.attendance[key]) {
        appState.attendance[key] = { tanggal: getTodayISO(), topik: '', records: {} };
      }
      getMasterMahasiswa().forEach(m => {
        appState.attendance[key].records[m.nim] = 'H';
      });
      saveState();
      renderCurrentTab();
      showToast('Seluruh 14 mahasiswa ditandai Hadir (H).', 'success');
    }

    function shareSessionRecapWA() {
      const activeSmt = getActiveSemesterId();
      const smtInfo = getSemesterInfo(activeSmt);
      const mk = getMkById(uiState.selectedMkId, activeSmt);
      const key = getAttendanceSessionKey(activeSmt, uiState.selectedMkId, uiState.selectedPertemuan);
      const sess = appState.attendance[key] || { tanggal: getTodayISO(), topik: '', records: {} };
      const mhsList = getMasterMahasiswa();

      let h = 0, i = 0, s = 0, a = 0;
      const lines = mhsList.map(m => {
        const st = sess.records?.[m.nim] || '-';
        if (st === 'H') h++;
        else if (st === 'I') i++;
        else if (st === 'S') s++;
        else if (st === 'A') a++;
        return `${m.no}. ${m.nama} (${m.nim}) : *${st}*`;
      });

      const teks = [
        `*REKAP PRESENSI PERKULIAHAN*`,
        `${INSTITUSI_INFO.program} - ${INSTITUSI_INFO.institusi}`,
        `🎓 *Periode:* ${smtInfo.fullLabel}`,
        `📚 *Mata Kuliah:* ${mk.nama}`,
        `🗓️ *Pertemuan:* Ke-${uiState.selectedPertemuan} (${formatDateIndo(sess.tanggal)})`,
        sess.topik ? `📝 *Materi:* ${sess.topik}` : null,
        `------------------------------------`,
        ...lines,
        `------------------------------------`,
        `📊 *Ringkasan:* Hadir: ${h} | Izin: ${i} | Sakit: ${s} | Alpa: ${a}`
      ].filter(Boolean).join('\n');

      launchWhatsAppMessage('Kirim Rekap Presensi Pertemuan', teks);
    }

                <div>
                  <span class="text-[10px] font-extrabold uppercase tracking-wider text-emerald-700">Kelompok Resmi Tersimpan</span>

    function renderEditableGroupCard(group, gIdx, totalGroups, scope, highlightNim) {
      const lCount = group.members.filter(m => m.jk === 'L').length;
      const pCount = group.members.filter(m => m.jk === 'P').length;
      const isMine = highlightNim && group.members.some(m => m.nim === highlightNim);

      return `
        <div class="p-3 rounded-xl border ${isMine ? 'bg-emerald-50/70 border-emerald-400' : 'bg-white border-slate-200/90'} space-y-2">
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-1.5">
              <span class="font-display font-extrabold text-xs text-emerald-900">${group.nama}</span>
              ${isMine ? '<span class="px-2 py-0.5 rounded-full bg-amber-400 text-emerald-950 text-[9px] font-extrabold">Kelompok Anda</span>' : ''}
            </div>
            <span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 text-[9.5px] font-bold">
              ${group.members.length} Org (${lCount}L • ${pCount}P)
            </span>
          </div>

          <input
            type="text"
            value="${(group.topik || '').replace(/"/g, '&quot;')}"
            onchange="updateGroupTopic('${scope}', ${gIdx}, this.value)"
            placeholder="Isi judul makalah / tema diskusi kelompok..."
            class="w-full px-2.5 py-1.5 rounded-lg bg-slate-50 border border-slate-200 text-[11px] font-medium text-slate-800"
          />

          <div class="divide-y divide-slate-100">
            ${group.members.map((m, mIdx) => `
              <div class="py-1.5 flex items-center justify-between gap-2 text-[11px]">
                <span class="truncate ${m.nim === highlightNim ? 'font-extrabold text-emerald-950' : 'text-slate-700'}">
                  ${mIdx + 1}. ${m.nama} <span class="text-[9.5px] font-bold text-slate-400">(${m.jk})</span>
                </span>
                ${totalGroups > 1 ? `
                  <select onchange="moveMemberBetweenGroups('${scope}', ${gIdx}, '${m.nim}', Number(this.value))" aria-label="Pindah kelompok" class="px-1.5 py-0.5 rounded bg-slate-100 border border-slate-200 text-[9.5px] font-bold text-slate-600 shrink-0">
                    ${Array.from({ length: totalGroups }, (_, tIdx) => `
                      <option value="${tIdx}" ${tIdx === gIdx ? 'selected' : ''}>Klp ${tIdx + 1}</option>
                    `).join('')}
                  </select>
                ` : ''}
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function updateGroupTopic(scope, gIdx, value) {
      const clean = value.trim();
      if (scope === 'preview' && uiState.previewGroups?.[gIdx]) {
        uiState.previewGroups[gIdx].topik = clean;
      } else if (scope === 'saved') {
        const groupKey = getGroupStorageKey(getActiveSemesterId(), uiState.kelompokMkId);
        if (appState.savedGroups[groupKey]?.[gIdx]) {
          appState.savedGroups[groupKey][gIdx].topik = clean;
          saveState();
        }
      }
    }

    function moveMemberBetweenGroups(scope, fromIdx, nim, toIdx) {
      if (fromIdx === toIdx) return;
      let targetList = null;
      if (scope === 'preview') {
        targetList = uiState.previewGroups;
      } else {
        const groupKey = getGroupStorageKey(getActiveSemesterId(), uiState.kelompokMkId);
        targetList = appState.savedGroups[groupKey];
      }
      if (!targetList || !targetList[fromIdx] || !targetList[toIdx]) return;

      const memberIdx = targetList[fromIdx].members.findIndex(m => m.nim === nim);
      if (memberIdx === -1) return;
      const [moved] = targetList[fromIdx].members.splice(memberIdx, 1);
      targetList[toIdx].members.push(moved);

      if (scope === 'saved') saveState();
      renderCurrentTab();
      showToast(`${moved.nama.split(' ')[0]} dipindahkan ke Kelompok ${toIdx + 1}.`, 'info');
    }

    function deleteSavedGroupsForMk() {
      const groupKey = getGroupStorageKey(getActiveSemesterId(), uiState.kelompokMkId);
      delete appState.savedGroups[groupKey];
      saveState();
      renderCurrentTab();
      showToast('Pembagian kelompok untuk MK ini dihapus.', 'info');
    }

    function getAllSpinnerCandidates() {
      const activeSmt = getActiveSemesterId();
      if (uiState.spinnerMode === 'individu') {
        return getMasterMahasiswa().map(m => ({
          id: m.nim,
          shortLabel: `${m.no}. ${m.nama.split(' ')[0]}`,
          label: m.nama,
          sub: `NIM ${m.nim} • ${m.jk === 'L' ? 'Laki-laki' : 'Perempuan'}`
        }));
      }
      const groupKey = getGroupStorageKey(activeSmt, uiState.spinnerMkId);
      const saved = appState.savedGroups[groupKey] || [];
      return saved.map(g => ({
        id: `${groupKey}_${g.nama}`,
        shortLabel: g.nama,
        label: g.nama,
        sub: `${g.topik ? `Topik: ${g.topik} • ` : ''}${g.members.map(m => m.nama.split(' ')[0]).join(', ')}`
      }));

    function getActiveWheelCandidates() {
      const all = getAllSpinnerCandidates();
      if (!uiState.spinnerExcludePicked) return all;
      return all.filter(c => !uiState.spinnerExcludedIds.includes(c.id));
    }

    function buildWheelSvgMarkup(candidates) {
      if (!candidates || candidates.length === 0) {
        return `
          <div class="w-56 h-56 mx-auto rounded-full bg-emerald-900/60 border-4 border-amber-400/50 flex flex-col items-center justify-center p-4 text-center">
            <p class="font-display font-extrabold text-xs text-amber-300">Semua Peserta Sudah Terpilih</p>
            <p class="text-[10px] text-emerald-100 mt-1">Klik "Reset Peserta" untuk mengulang putaran.</p>
          </div>
        `;
      }

      const palette = ['#065f46', '#0f766e', '#047857', '#115e59', '#b45309', '#064e3b', '#0d9488'];
      const n = candidates.length;
      const cx = 130, cy = 130, r = 120;

      if (n === 1) {
        return `
          <svg viewBox="0 0 260 260" class="w-60 h-60 mx-auto drop-shadow-xl">
            <circle cx="${cx}" cy="${cy}" r="${r}" fill="#065f46" stroke="#fbbf24" stroke-width="5" />
            <text x="${cx}" y="${cy}" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle" dominant-baseline="middle">${candidates[0].shortLabel}</text>
          </svg>
        `;
      }

      const sliceAngle = 360 / n;
      const slices = candidates.map((cand, idx) => {
        const startDeg = idx * sliceAngle - 90;
        const endDeg = (idx + 1) * sliceAngle - 90;
        const startRad = (Math.PI / 180) * startDeg;
        const endRad = (Math.PI / 180) * endDeg;

        const x1 = cx + r * Math.cos(startRad);
        const y1 = cy + r * Math.sin(startRad);
        const x2 = cx + r * Math.cos(endRad);
        const y2 = cy + r * Math.sin(endRad);
        const largeArc = sliceAngle > 180 ? 1 : 0;
        const fill = palette[idx % palette.length];

        const midDeg = startDeg + sliceAngle / 2;
        const midRad = (Math.PI / 180) * midDeg;
        const tx = cx + r * 0.63 * Math.cos(midRad);
        const ty = cy + r * 0.63 * Math.sin(midRad);
        const textAngle = midDeg + 90;

        return `
          <path d="M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z"
                fill="${fill}" stroke="#ffffff" stroke-width="1.5" />
          <text x="${tx.toFixed(2)}" y="${ty.toFixed(2)}"
                fill="#ffffff"
                font-size="${n > 10 ? '8.5' : '10'}"
                font-weight="800"
                text-anchor="middle"
                dominant-baseline="middle"
                transform="rotate(${textAngle.toFixed(2)} ${tx.toFixed(2)} ${ty.toFixed(2)})">
            ${cand.shortLabel.slice(0, 14)}
          </text>
        `;
      }).join('');

      return `
        <div class="relative w-64 h-64 mx-auto flex items-center justify-center">
          <div class="absolute -top-1.5 left-1/2 -translate-x-1/2 z-20 drop-shadow-md">
            <svg width="28" height="28" viewBox="0 0 28 28">
              <polygon points="14,26 3,4 25,4" fill="#fbbf24" stroke="#78350f" stroke-width="2" />
            </svg>
          </div>
          <div id="wheel-rotor" style="transform: rotate(${uiState.spinnerRotation}deg); transition: transform 3.6s cubic-bezier(0.15, 0.85, 0.22, 1);" class="w-60 h-60 rounded-full shadow-2xl">
            <svg viewBox="0 0 260 260" class="w-full h-full">
              ${slices}
              <circle cx="${cx}" cy="${cy}" r="119" fill="none" stroke="#fbbf24" stroke-width="4.5" />
              <circle cx="${cx}" cy="${cy}" r="22" fill="#022c22" stroke="#fbbf24" stroke-width="3" />
              <circle cx="${cx}" cy="${cy}" r="7" fill="#fbbf24" />
            </svg>
          </div>
        </div>
      `;
    }

                <input type="checkbox" ${uiState.spinnerExcludePicked ? 'checked' : ''} onchange="uiState.spinnerExcludePicked=this.checked; renderCurrentTab();" class="w-4 h-4 accent-emerald-700 rounded" />
                <span>Jangan pilih ulang pemenang (${activeCandidates.length}/${allCandidates.length})</span>

                  <i data-lucide="${uiState.spinnerSoundOn ? 'volume-2' : 'volume-x'}" class="w-3.5 h-3.5"></i>

            <div class="p-4 rounded-2xl bg-gradient-to-br from-emerald-950 via-emerald-900 to-teal-900 text-white border-2 border-amber-400/50 space-y-3">
              ${buildWheelSvgMarkup(activeCandidates)}

              <div id="spinner-display" class="p-3 rounded-xl bg-black/25 border border-white/15 text-center ${uiState.spinnerWinner ? 'winner-glow' : ''}">
                <span class="text-[9.5px] font-extrabold uppercase tracking-widest text-amber-300">
                  ${uiState.spinnerWinner ? '🎉 TERPILIH MAJU PRESENTASI' : 'RODA UNDIAN GILIRAN'}
                </span>
                <p id="spinner-main-text" class="font-display font-extrabold text-sm mt-1">
                  ${uiState.spinnerWinner ? uiState.spinnerWinner.label : 'Siap Diputar'}
                </p>
                <p id="spinner-sub-text" class="text-[10.5px] text-emerald-200 mt-0.5">
                  ${uiState.spinnerWinner ? uiState.spinnerWinner.sub : `${activeCandidates.length} peserta siap diundi`}
                </p>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <button type="button" onclick="spinRandomizer()" class="py-3 px-3 rounded-2xl bg-amber-500 hover:bg-amber-600 text-emerald-950 text-xs font-extrabold shadow-md flex items-center justify-center gap-1.5">
                <i data-lucide="play" class="w-4 h-4"></i>

              <button type="button" onclick="randomizeAllPresentationOrder()" class="py-3 px-3 rounded-2xl bg-emerald-800 hover:bg-emerald-900 text-white text-xs font-extrabold shadow-md flex items-center justify-center gap-1.5">
                <i data-lucide="list-ordered" class="w-4 h-4 text-amber-300"></i>
                <span>Acak Urutan Semua</span>
              </button>

          </section>

          ${uiState.batchOrderResult ? `
            <section class="bg-amber-50 border border-amber-300 rounded-2xl p-3.5 space-y-2.5">
              <div class="flex items-center justify-between gap-2">
                <div>
                  <span class="text-[10px] font-extrabold uppercase text-amber-800">Urutan Tampil Lengkap</span>
                  <h4 class="font-display font-bold text-xs text-slate-900">${uiState.batchOrderResult.mkNama}</h4>
                </div>
                <button type="button" onclick="shareBatchOrderWA()" class="px-2.5 py-1.5 rounded-xl bg-emerald-800 text-white text-[10.5px] font-extrabold">
                  Kirim WA

              </div>
              <div class="space-y-1">
                ${uiState.batchOrderResult.items.map((it, idx) => `
                  <div class="p-2 rounded-xl bg-white border border-amber-200/80 flex items-center justify-between gap-2 text-xs">
                    <span class="font-extrabold text-emerald-900">Urutan #${idx + 1}: ${it.label}</span>
                    <span class="text-[10px] text-slate-500 truncate max-w-[48%]">${it.sub}</span>

    function playWheelSound(type = 'tick') {
      if (!uiState.spinnerSoundOn) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'tick') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(520, ctx.currentTime);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.045);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
          osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.14, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
          osc.start();
          osc.stop(ctx.currentTime + 0.46);
        }
      } catch (e) {
        // Abaikan jika browser membatasi audio otomatis
      }
    }

    function resetSpinnerExcluded() {
      uiState.spinnerExcludedIds = [];
      uiState.spinnerWinner = null;
      renderCurrentTab();
      showToast('Daftar peserta undian direset penuh.', 'info');
    }

    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function generateSmartGroups() {
      const mhsList = getMasterMahasiswa();
      const k = Math.max(2, Math.min(mhsList.length, uiState.jumlahKelompok));
      const groups = Array.from({ length: k }, (_, idx) => ({
        nama: `Kelompok ${idx + 1}`,
        topik: '',
        members: []
      }));

      if (uiState.metodeKelompok === 'gender') {
        const laki = shuffleArray(mhsList.filter(m => m.jk === 'L'));
        const perempuan = shuffleArray(mhsList.filter(m => m.jk === 'P'));
        const combined = [...laki, ...perempuan];
        combined.forEach((m, idx) => {
          groups[idx % k].members.push(m);
        });
      } else if (uiState.metodeKelompok === 'nim') {
        const sortedByNim = [...mhsList].sort((a, b) => a.nim.localeCompare(b.nim));
        sortedByNim.forEach((m, idx) => {
          groups[idx % k].members.push(m);
        });
      } else {
        shuffleArray(mhsList).forEach((m, idx) => {
          groups[idx % k].members.push(m);
        });
      }

      uiState.previewGroups = groups;
      renderCurrentTab();
    }

    function saveGeneratedGroups() {
      if (!uiState.previewGroups) return;
      const activeSmt = getActiveSemesterId();
      const groupKey = getGroupStorageKey(activeSmt, uiState.kelompokMkId);
      appState.savedGroups[groupKey] = uiState.previewGroups;
      uiState.previewGroups = null;
      saveState();
      renderCurrentTab();
      showToast(`Kelompok ${getSemesterInfo(activeSmt).label} berhasil disimpan!`, 'success');
    }

    function copySavedGroupWA() {
      const activeSmt = getActiveSemesterId();
      const smtInfo = getSemesterInfo(activeSmt);
      const groupKey = getGroupStorageKey(activeSmt, uiState.kelompokMkId);
      const groups = appState.savedGroups[groupKey];
      if (!groups) return;
      const mk = getMkById(uiState.kelompokMkId, activeSmt);
      const blocks = groups.map(g => {
        const list = g.members.map((m, idx) => `   ${idx + 1}. ${m.nama} (${m.jk})`).join('\n');
        return `*${g.nama}*${g.topik ? `\n📌 _Topik: ${g.topik}_` : ''}\n${list}`;
      });
      const teks = [
        `*PEMBAGIAN KELOMPOK DISKUSI / MAKALAH*`,
        `${INSTITUSI_INFO.program} - ${INSTITUSI_INFO.institusi}`,
        `🎓 *Periode:* ${smtInfo.fullLabel}`,
        `📚 *Mata Kuliah:* ${mk.nama}`,
        `------------------------------------`,
        ...blocks
      ].join('\n\n');

    function spinRandomizer() {
      if (uiState.isSpinning) return;
      const activeSmt = getActiveSemesterId();
      const mk = getMkById(uiState.spinnerMkId, activeSmt);
      const candidates = getActiveWheelCandidates();

      if (!candidates || candidates.length === 0) {
        if (uiState.spinnerMode === 'kelompok' && getAllSpinnerCandidates().length === 0) {
          showToast('Simpan pembagian kelompok pada MK ini terlebih dahulu.', 'error');
        } else {
          showToast('Semua peserta sudah terpilih. Klik Reset untuk mengulang.', 'info');
        }
        return;
      }

      uiState.isSpinning = true;
      const winnerIdx = Math.floor(Math.random() * candidates.length);
      const winner = candidates[winnerIdx];
      const n = candidates.length;
      const sliceAngle = 360 / n;
      const targetSliceCenter = winnerIdx * sliceAngle + sliceAngle / 2;
      const desiredMod = (360 - targetSliceCenter) % 360;
      const currentMod = ((uiState.spinnerRotation % 360) + 360) % 360;
      const delta = (desiredMod - currentMod + 360) % 360;
      const extraSpins = 360 * 5;
      uiState.spinnerRotation += extraSpins + delta;

      const rotor = document.getElementById('wheel-rotor');
      if (rotor) {
        rotor.style.transform = `rotate(${uiState.spinnerRotation}deg)`;
      }

      let ticks = 0;
      const tickTimer = setInterval(() => {
        playWheelSound('tick');
        ticks++;
        if (ticks >= 18) clearInterval(tickTimer);
      }, 160);

      setTimeout(() => {
        clearInterval(tickTimer);
        playWheelSound('win');
        uiState.isSpinning = false;
        uiState.spinnerWinner = winner;

        if (uiState.spinnerExcludePicked && !uiState.spinnerExcludedIds.includes(winner.id)) {
          uiState.spinnerExcludedIds.push(winner.id);
        }

        const now = new Date();
        const jam = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        appState.spinnerHistory.unshift({
          label: winner.label,
          sub: winner.sub,
          mkNama: mk?.nama || '-',
          waktu: `${formatDateIndo(getTodayISO())} ${jam}`
        });
        saveState();
        renderCurrentTab();
      }, 3650);
    }

    function randomizeAllPresentationOrder() {
      const activeSmt = getActiveSemesterId();
      const mk = getMkById(uiState.spinnerMkId, activeSmt);
      const candidates = getActiveWheelCandidates();
      if (!candidates || candidates.length === 0) {
        showToast('Tidak ada peserta/kelompok tersisa untuk diacak.', 'error');
        return;
      }
      const shuffled = shuffleArray(candidates);
      uiState.batchOrderResult = {
        mkNama: mk?.nama || '-',
        items: shuffled
      };
      playWheelSound('win');
      renderCurrentTab();
      showToast(`Urutan tampil ${shuffled.length} peserta berhasil diacak!`, 'success');
    }

    function parseTaskSyncCode(text) {
      if (!text) return null;
      const m = text.match(/\[TASK_SYNC\|([A-Za-z0-9_-]+)\|([0-9]+)\|DONE\]/i);
      if (!m) return null;
      return {
        tugasId: m[1].trim(),
        nim: m[2].trim()
      };
    }

    function processWaSyncImport() {
      const raw = (document.getElementById('wa-sync-input')?.value || '').trim();
      if (!raw) {
        showToast('Tempel pesan WA terlebih dahulu.', 'error');
        return;
      }
      const lines = raw.split(/\n+/);
      let importedAtt = 0;
      let importedTask = 0;

      const handleLine = (line) => {
        const parsed = parseSemesterSyncCode(line);
        if (parsed && getStudentByNim(parsed.nim)) {
          const key = getAttendanceSessionKey(parsed.smtId, parsed.mkId, parsed.pertemuan);
          if (!appState.attendance[key]) {
            appState.attendance[key] = { tanggal: getTodayISO(), topik: `Pertemuan ke-${parsed.pertemuan}`, records: {} };
          }
          appState.attendance[key].records[parsed.nim] = parsed.status;
          importedAtt++;
        }

        const taskSync = parseTaskSyncCode(line);
        if (taskSync && getStudentByNim(taskSync.nim)) {
          const tgs = appState.assignments.find(a => a.id === taskSync.tugasId);
          if (tgs) {
            if (!tgs.submissions) tgs.submissions = {};
            if (!tgs.submissions[taskSync.nim]) tgs.submissions[taskSync.nim] = { done: false, score: '', note: '', submittedAt: '' };
            tgs.submissions[taskSync.nim].done = true;
            tgs.submissions[taskSync.nim].submittedAt = getTodayISO();
            importedTask++;
          }
        }
      };

      lines.forEach(handleLine);
      if (importedAtt === 0 && importedTask === 0) {
        handleLine(raw);
      }

      if (importedAtt === 0 && importedTask === 0) {
        showToast('Kode [SYNC|...] atau [TASK_SYNC|...] tidak ditemukan.', 'error');
        return;
      }

      saveState();
      closeModal();
      renderApp();
      showToast(`Sinkronisasi berhasil (${importedAtt} presensi, ${importedTask} tugas)!`, 'success');
    }

    function processWaSyncImport() {
      const raw = (document.getElementById('wa-sync-input')?.value || '').trim();
      if (!raw) {
        showToast('Tempel pesan WA terlebih dahulu.', 'error');
        return;
      }
      const lines = raw.split(/\n+/);
      let imported = 0;

      lines.forEach(line => {
        const parsed = parseSemesterSyncCode(line);
        if (parsed && getStudentByNim(parsed.nim)) {
          const key = getAttendanceSessionKey(parsed.smtId, parsed.mkId, parsed.pertemuan);
          if (!appState.attendance[key]) {
            appState.attendance[key] = { tanggal: getTodayISO(), topik: `Pertemuan ke-${parsed.pertemuan}`, records: {} };
          }
          appState.attendance[key].records[parsed.nim] = parsed.status;
          imported++;
        }
      });

      if (imported === 0) {
        const single = parseSemesterSyncCode(raw);
        if (single && getStudentByNim(single.nim)) {
          const key = getAttendanceSessionKey(single.smtId, single.mkId, single.pertemuan);
          if (!appState.attendance[key]) {
            appState.attendance[key] = { tanggal: getTodayISO(), topik: `Pertemuan ke-${single.pertemuan}`, records: {} };
          }
          appState.attendance[key].records[single.nim] = single.status;
          imported = 1;
        }
      }

      if (imported === 0) {
        showToast('Kode [SYNC|...] tidak ditemukan atau NIM tidak valid.', 'error');
        return;
      }

      saveState();
      closeModal();
      renderCurrentTab();
      showToast(`${imported} laporan kehadiran mahasiswa berhasil disinkronkan!`, 'success');
    }

    function openSemesterMkEditorModal(targetSmt) {
      const smt = Number(targetSmt || getActiveSemesterId());
      const smtInfo = getSemesterInfo(smt);
      const currentList = getSemesterMataKuliahList(smt);
      const textLines = currentList.map(m => m.nama).join('\n');

      openModal(`
        <div class="p-5 overflow-y-auto">
          <div class="flex items-start justify-between gap-2 pb-3 border-b border-slate-100">
            <div>
              <span class="text-[10px] font-extrabold uppercase tracking-wider text-emerald-700">Kurikulum 2 TP (4 Semester)</span>
              <h3 class="font-display font-bold text-sm text-slate-900 mt-0.5">Kelola Mata Kuliah — ${smtInfo.fullLabel}</h3>
            </div>
            <button onclick="closeModal()" class="p-1.5 rounded-xl bg-slate-100 text-slate-500">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>

          <div class="mt-3 grid grid-cols-4 gap-1">
            ${SEMESTERS_MASTER.map(s => `
              <button type="button" onclick="openSemesterMkEditorModal(${s.id})" class="py-1.5 px-1 rounded-xl text-center text-[10px] font-bold border ${s.id === smt ? 'bg-emerald-800 text-white border-emerald-800' : 'bg-slate-50 text-slate-600 border-slate-200'}">
                ${s.label}<br><span class="text-[8px] font-normal">${s.tp}</span>
              </button>
            `).join('')}
          </div>

          <form onsubmit="saveSemesterMkList(event, ${smt})" class="mt-3 space-y-3">
            <div>
              <label class="block text-[11px] font-bold text-slate-700 mb-1">
                Daftar Mata Kuliah ${smtInfo.label} (1 baris = 1 MK, masing-masing 16 Pertemuan)
              </label>
              <textarea id="smt-mk-textarea" rows="7" class="w-full p-3 rounded-xl bg-slate-50 border border-slate-200 text-xs font-semibold text-slate-800 leading-relaxed" required>${textLines}</textarea>
            </div>
            <div class="flex gap-2">
              <button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold">Batal</button>
              <button type="submit" class="flex-1 py-2.5 rounded-xl bg-emerald-800 text-white text-xs font-bold shadow-xs">Simpan MK ${smtInfo.label}</button>
            </div>
          </form>
        </div>
      `);
    }

    function saveSemesterMkList(event, smtId) {
      event.preventDefault();
      const smt = Number(smtId);
      const raw = document.getElementById('smt-mk-textarea')?.value || '';
      const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
      if (lines.length === 0) {
        showToast('Minimal harus ada 1 mata kuliah.', 'error');
        return;
      }
      const prefix = smt === 1 ? 'MK' : `S${smt}_MK`;
      const mapped = lines.map((nama, i) => ({
        id: `${prefix}${String(i + 1).padStart(2, '0')}`,
        idx: i + 1,
        kode: `PAI-${500 + smt * 100 + (i + 1)}`,
        nama: nama.toUpperCase()
      }));

      if (smt === 1) {
        appState.customMataKuliah = mapped;
      } else {
        if (!appState.semesterMataKuliah) appState.semesterMataKuliah = {};
        appState.semesterMataKuliah[smt] = mapped;
      }
      ensureSemesterSelectionConsistency(smt);
      saveState();
      closeModal();
      renderCurrentTab();
      showToast(`Daftar MK ${getSemesterInfo(smt).fullLabel} (${mapped.length} MK × 16 Pertemuan) disimpan!`, 'success');
    }

    function openMasterDataManagerModal() {
      const mhsLines = getMasterMahasiswa().map(m => `${m.nim} | ${m.jk} | ${m.nama}`).join('\n');
      openModal(`
        <div class="p-5 overflow-y-auto space-y-3">
          <div class="flex items-start justify-between gap-2 pb-2.5 border-b border-slate-100">
            <div>
              <span class="text-[10px] font-extrabold uppercase tracking-wider text-emerald-700">Data Master Kelas</span>
              <h3 class="font-display font-bold text-sm text-slate-900 mt-0.5">Daftar Mahasiswa (14 Mahasiswa)</h3>
            </div>
            <button onclick="closeModal()" class="p-1.5 rounded-xl bg-slate-100 text-slate-500">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
          <p class="text-[10.5px] text-slate-500">Format per baris: <code class="font-mono">NIM | L/P | NAMA LENGKAP</code></p>
          <textarea id="master-mhs-lines" rows="9" class="w-full p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-[11px] font-mono">${mhsLines}</textarea>
          <div class="flex gap-2">
            <button type="button" onclick="resetDefaultMasterStudents()" class="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold">Pulihkan 14 Default</button>
            <button type="button" onclick="saveMasterStudentsList()" class="flex-1 py-2.5 rounded-xl bg-emerald-800 text-white text-xs font-bold">Simpan Daftar</button>
          </div>
        </div>
      `);
    }

    function saveMasterStudentsList() {
      const raw = (document.getElementById('master-mhs-lines')?.value || '').trim();
      const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
      const parsed = [];
      lines.forEach((line, idx) => {
        const parts = line.split('|').map(p => p.trim());
        if (parts.length >= 3) {
          parsed.push({
            no: idx + 1,
            nim: parts[0],
            jk: parts[1].toUpperCase() === 'L' ? 'L' : 'P',
            nama: parts.slice(2).join(' ').toUpperCase()
          });
        }
      });
      if (parsed.length === 0) {
        showToast('Format baris tidak valid. Gunakan NIM | L/P | NAMA', 'error');
        return;
      }
      appState.customMahasiswa = parsed;
      saveState();
      closeModal();
      renderCurrentTab();
      showToast(`Daftar ${parsed.length} mahasiswa berhasil diperbarui!`, 'success');
    }

    function resetDefaultMasterStudents() {
      appState.customMahasiswa = null;
      saveState();
      closeModal();
      renderCurrentTab();
      showToast('Daftar 14 mahasiswa asli dipulihkan.', 'success');
    }

    function openSecretarySettingsModal() {
      openModal(`
        <div class="p-5 overflow-y-auto space-y-3">
          <div class="flex items-start justify-between gap-2 pb-2.5 border-b border-slate-100">
            <div>
              <span class="text-[10px] font-extrabold uppercase tracking-wider text-emerald-700">Konfigurasi Sekretaris</span>
              <h3 class="font-display font-bold text-sm text-slate-900 mt-0.5">Nomor WA Tujuan & PIN Sekretaris</h3>
            </div>
            <button onclick="closeModal()" class="p-1.5 rounded-xl bg-slate-100 text-slate-500">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
          <form onsubmit="saveSecretarySettings(event)" class="space-y-3">
            <div>
              <label class="block text-[11px] font-bold text-slate-600 mb-1">Nama Sekretaris Kelas (untuk Tanda Tangan Kop)</label>
              <input id="sec-set-nama" type="text" value="${appState.secretaryConfig?.namaSekretaris || 'Sekretaris Kelas PAI Multikultur'}" class="w-full p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs font-bold" required />
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-600 mb-1">Nomor WhatsApp Sekretaris</label>
              <input id="sec-set-phone" type="text" value="${getSecretaryPhoneDisplay()}" class="w-full p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs font-mono font-bold" required />
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-600 mb-1">PIN Login Sekretaris</label>
              <input id="sec-set-pin" type="text" maxlength="6" value="${appState.secretaryConfig?.pin || '0142'}" class="w-full p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs font-mono font-bold" required />
            </div>
            <button type="submit" class="w-full py-2.5 rounded-xl bg-emerald-800 text-white text-xs font-bold">Simpan Pengaturan</button>
          </form>
        </div>
      `);
    }

    function saveSecretarySettings(e) {
      e.preventDefault();
      appState.secretaryConfig.namaSekretaris = (document.getElementById('sec-set-nama')?.value || '').trim();
      appState.secretaryConfig.phoneRaw = (document.getElementById('sec-set-phone')?.value || '').trim();
      appState.secretaryConfig.pin = (document.getElementById('sec-set-pin')?.value || '0142').trim();
      saveState();
      closeModal();
      renderApp();
      showToast('Pengaturan Sekretaris Kelas disimpan!', 'success');
    }

    /**
     * =====================================================================
     * 16. INISIALISASI APLIKASI SAAT HALAMAN SELESAI DIMUAT
     * =====================================================================
     */
    document.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
</body>
</html>
